name: Deploy

on:
  # Push auto-deploys the STOREFRONT ONLY (see each job's `if:`). It was
  # commented out in e09c21e1 — not as policy, but as the last flip of a
  # toggle sequence that used the trigger as a manual deploy button
  # (5500ce73 on, 5d094548 on, e09c21e1 off, all within 20 minutes).
  # workflow_dispatch landed 31 minutes later and made the hack unnecessary;
  # nobody re-enabled push, so main silently stopped reaching the live site
  # and drifted 82 commits behind before anyone noticed.
  #
  # Restored for the storefront because that service IS tanmatra.food, it is
  # the surface under active iteration, it applies no migrations, and it
  # self-verifies and rolls itself back (see the storefront job).
  # api-server and the legacy tanmatra SPA stay dispatch-only: the api-server
  # has no migration step in this pipeline, so auto-deploying it ahead of a
  # pending migration breaks checkout.
  push:
    branches: [main]
  # Manual dispatch deploys ALL THREE services from the chosen ref.
  # paths-filter cannot diff a dispatch event (no before/after commits), so
  # the deploy jobs explicitly bypass the filter on dispatch — without this,
  # a dispatch silently deployed nothing, and deploying required committing
  # push-trigger toggles to main (which happened twice; see e09c21e1).
  #
  # only_storefront rolls JUST the dark-preview `storefront` service and leaves
  # the production api-server + domain `tanmatra` untouched — for verifying a
  # storefront change on its deployed URL without a full three-service release.
  workflow_dispatch:
    inputs:
      only_storefront:
        description: "Deploy only the dark-preview storefront (skip api-server + tanmatra)"
        required: false
        type: boolean
        default: false

# Don't let two pushes to main race each other into the Cloud Run services.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Detect which surfaces this push touched so we don't redeploy unchanged
  # services. Outputs are read by the deploy jobs below via `needs`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      # Skipped on workflow_dispatch (nothing to diff); outputs come back
      # empty and the deploy jobs' event-name conditions take over.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            api:
              - 'artifacts/api-server/**'
              - 'lib/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'artifacts/tanmatra/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            storefront:
              - 'artifacts/storefront/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'

  # Build the api-server Docker image with Cloud Build, then roll the
  # `wellness-foods` Cloud Run service. Runs only when backend-relevant
  # files changed.
  cloud-run:
    needs: changes
    # DISPATCH ONLY — deliberately not reachable from a push. The `api` filter
    # matches lib/** and pnpm-lock.yaml, so the old `|| needs.changes.outputs.api`
    # clause would have auto-rolled the api-server on almost every merge. This
    # pipeline never applies Drizzle migrations, so a deploy that lands ahead of
    # a pending one breaks corporate checkout and the lead routes. Releasing the
    # backend stays a human action: migrate first, then dispatch.
    if: github.event_name == 'workflow_dispatch' && !inputs.only_storefront
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: wellness-foods
    # Petpooja POS activation (see the Deploy step): the three
    # brand-tanmatra-petpooja-* Secret Manager secrets referenced in
    # --set-secrets MUST exist and be readable by the runtime service account
    # before this deploy runs — gcloud fails the deploy on a missing secret.
    # PETPOOJA_RESTAURANT_ID is a non-secret restaurant identifier inlined as a
    # literal in --update-env-vars (like ALLOWED_ORIGINS); the integration
    # activates once the three secrets above are present (petpoojaConfig()
    # requires all four).
    #
    # Petpooja issues TWO distinct non-secret identifiers for this outlet and
    # they are NOT interchangeable:
    #   • Menu Sharing Code  cq5hnj3629  — ordering/menu integration (pos.petpooja.com)
    #                                    — AND the Inventory API (api.petpooja.com),
    #                                      verified by probing the live outlet
    #   • RID                355738      — what Petpooja provisioned inventory
    #                                      against and what a support thread will
    #                                      quote. Used ONLY as the arming switch;
    #                                      the Inventory API rejects it as an
    #                                      identifier with code 103. Do not send it.
    # PETPOOJA_MENU_SHARING_CODE is pinned explicitly below rather than left to
    # petpoojaConfig()'s `|| restId` fallback, so the sharing code no longer
    # rides on PETPOOJA_RESTAURANT_ID. That fallback silently coupled the two:
    # correcting one identifier would have changed the other. See the open
    # question in the runbook — Save Order's `restID` may want 355738, not the
    # sharing code, and a wrong value there fails silently at the POS.
    #
    # Both inventory syncs ship DRY-RUN ON (PETPOOJA_*_SYNC_DRY_RUN=1 below).
    # Setting PETPOOJA_INVENTORY_RID is what arms them: with the RID plus the
    # three secrets present, petpoojaInventoryConfig() is non-null and both
    # timers register and poll for real. The vendor's Inventory API reference is
    # client-rendered and could not be read, so our endpoint paths, request-body
    # keys and response shapes are inferred — see the ⚠ block in
    # petpoojaInventory.ts. A shape we guessed wrong mostly degrades safely (an
    # unreadable field means the line is refused), but the one case that does
    # NOT is a field we parse correctly and interpret wrongly — e.g. a stock
    # `quantity` that is the day's consumption rather than the closing balance.
    # That writes a plausible wrong number into kitchen_stock.on_hand_qty, which
    # lib/reorder.ts thresholds against, and the kitchen either runs out or buys
    # the pantry twice.
    #
    # Dry run fetches, matches and logs the full plan without writing. To go
    # live: deploy once with these set, read the two "petpooja * sync" summary
    # lines plus the "rows needing attention" warns in Cloud Logging, confirm
    # the quantities and prices are what the outlet actually holds and paid,
    # then delete these two entries. Do purchases first and stock second — a
    # wrong price is a wrong margin on a report; a wrong on-hand quantity moves
    # real food.
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          # Submit async to avoid VPC-SC log-streaming errors from the
          # GitHub runner. Poll build status directly instead.
          BUILD_ID=$(gcloud builds submit \
            --tag asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} \
              --format='value(status)')
            echo "[$i/40] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --update-env-vars "^;^ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }};ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }};DISABLE_SCHEDULERS=true;FLAG_PLAN_V2=true;SESSION_SAMESITE=none;ALLOWED_ORIGINS=https://tanmatra.food,https://www.tanmatra.food,https://tanmatra-yftxztp3xq-em.a.run.app,https://tanmatra-475157072474.asia-south2.run.app,http://localhost:5173,http://localhost:3000;RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }};RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }};PETPOOJA_RESTAURANT_ID=cq5hnj3629;PETPOOJA_MENU_SHARING_CODE=cq5hnj3629;PETPOOJA_INVENTORY_RID=355738;PETPOOJA_PURCHASE_SYNC_DRY_RUN=1;PETPOOJA_STOCK_SYNC_DRY_RUN=1;REDIS_HOST=redis-17230.crce280.asia-south1-1.gcp.cloud.redislabs.com;REDIS_PORT=17230;REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }};BULLMQ_PREFIX=prod;GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }};RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }};TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }};TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }};TWILIO_VERIFY_SERVICE_SID=${{ secrets.TWILIO_VERIFY_SERVICE_SID }};PRIVATE_OBJECT_DIR=${{ secrets.PRIVATE_OBJECT_DIR }}" \
            --set-secrets "ADMIN_SESSION_SECRET=brand-tanmatra-admin-session-secret:latest,DATABASE_URL=brand-tanmatra-database-url:latest,SESSION_SECRET=brand-tanmatra-session-secret:latest,CLINICAL_KMS_MASTER_KEY=brand-tanmatra-clinical-kms-key:latest,PETPOOJA_APP_KEY=brand-tanmatra-petpooja-app-key:latest,PETPOOJA_APP_SECRET=brand-tanmatra-petpooja-app-secret:latest,PETPOOJA_ACCESS_TOKEN=brand-tanmatra-petpooja-access-token:latest" \
            --add-cloudsql-instances "${GCP_PROJECT}:asia-south2:brand-tanmatra-db" \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --quiet

      - name: Smoke-test /api/livez
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "$URL/api/livez" >/dev/null; then
              echo "livez OK"; exit 0
            fi
            echo "livez attempt $i failed, retrying..."; sleep 5
          done
          echo "livez never returned 200"; exit 1

  # Build the SPA image and roll the `tanmatra` Cloud Run service — the
  # service the production domain (tanmatra.food) actually serves. This
  # replaces the old Firebase Hosting deploy: tanmatra.food is a Cloud Run
  # domain mapping (server: Google Frontend), NOT Firebase, so the Firebase
  # deploys never reached the live site. Deploying here, in the same pipeline
  # that runs on every push to main, makes frontend rollouts reliable instead
  # of depending on a separate Cloud Build trigger.
  #
  # Runs whenever web files changed, regardless of the cloud-run job's result
  # (the frontend targets a STABLE API URL, so a backend blip must not block
  # frontend fixes); only a cancelled run aborts it.
  frontend-cloud-run:
    needs: [changes, cloud-run]
    # DISPATCH ONLY. The legacy SPA no longer fronts the domain, so there is
    # nothing to gain from auto-rolling it on every merge — and its `web`
    # filter also matches lib/**, which would have fired it constantly.
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' && !inputs.only_storefront &&
      needs.cloud-run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: tanmatra
      API_URL: https://wellness-foods-475157072474.asia-south2.run.app/api
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          IMAGE=asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }}
          # Custom Dockerfile + build-arg (VITE_API_BASE is baked into the
          # bundle), so we submit an inline build config rather than --tag.
          # Async + CLOUD_LOGGING_ONLY avoids VPC-SC log-streaming errors.
          cat > /tmp/frontend-cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - --build-arg
                - VITE_API_BASE=/api
                - --build-arg
                - BUILD_SHA=${{ github.sha }}
                - --build-arg
                - BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                - --build-arg
                - VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
                - --build-arg
                - VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
                - --build-arg
                - VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
                - --build-arg
                - VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
                - --build-arg
                - VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
                - --build-arg
                - VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
                - --build-arg
                - VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
                - --build-arg
                - VITE_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
                - -t
                - ${IMAGE}
                - -f
                - artifacts/tanmatra/Dockerfile
                - .
          images:
            - ${IMAGE}
          options:
            logging: CLOUD_LOGGING_ONLY
            machineType: E2_HIGHCPU_8
          EOF
          BUILD_ID=$(gcloud builds submit \
            --config /tmp/frontend-cloudbuild.yaml \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)' .)
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 50); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} --format='value(status)')
            echo "[$i/50] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"; exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --update-env-vars "API_UPSTREAM=${API_URL%/api},BUILD_SHA=${{ github.sha }},BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --quiet

      # This step used to be absent, deliberately: while tanmatra.food was served
      # BY this service, a traffic pin was the safety rail and promotion was done
      # by revision name outside CI.
      #
      # That rationale has expired. tanmatra.food is now mapped to the
      # `storefront` service — it answers /api/build with app=tanmatra-web — so
      # the pin no longer protects the production domain. All it does now is
      # strand deploys: run 30166329200 deployed 8e33968212 successfully and this
      # service kept serving 5176c1131c, two days old, because 0% of traffic ever
      # moved. Nine merges' worth of legacy-app fixes sat undelivered.
      #
      # If a pin is ever wanted here again, re-add it deliberately — the
      # deploy-truth assert below will then fail loudly instead of leaving a
      # green check over a stale serve.
      - name: Route traffic to the new revision
        run: |
          gcloud run services update-traffic ${SERVICE} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --to-latest \
            --quiet

      - name: Smoke-test /checkout serves the SPA shell
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          # A client-only route must now return the small __spa-fallback.html
          # shell, not the large prerendered home document (the hydration-crash
          # bug). Treat a sub-20KB response as the fixed SPA shell.
          for i in 1 2 3 4 5 6; do
            BYTES=$(curl -s "$URL/checkout" | wc -c)
            echo "[$i/6] /checkout bytes: $BYTES"
            if [ "$BYTES" -gt 0 ] && [ "$BYTES" -lt 20000 ]; then
              echo "checkout serves SPA shell — OK"; exit 0
            fi
            sleep 5
          done
          echo "checkout still not serving the SPA shell"; exit 1

      # Deploy-truth (the TNM-OPS-01 pattern the storefront job already carries).
      #
      # The smoke test above cannot catch a stale serve: a 2-day-old revision
      # also returns a sub-20KB /checkout shell, so it passed green throughout
      # run 30166329200 while this service served the wrong build. A smoke test
      # proves the service is UP; only comparing the running revision's reported
      # commit to the one we deployed proves it is the RIGHT build.
      #
      # Fatal on purpose. "Deployed but not serving" is the failure this job
      # exists to prevent, and the previous non-fatal notice below demonstrably
      # did not prevent it.
      - name: Assert deployed sha (/api/build == pushed commit)
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sf "$URL/api/build" || true)
            echo "attempt $i: $BODY"
            DEPLOYED=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
            if [ "$DEPLOYED" = "${{ github.sha }}" ]; then
              echo "deploy-truth OK: $DEPLOYED"; exit 0
            fi
            sleep 5
          done
          echo "deploy-truth FAILED: /api/build sha never matched ${{ github.sha }}"
          echo "The revision was created but traffic is not on it (check for a traffic pin), or BUILD_SHA drifted."
          exit 1

      # Domain promotion is deliberately manual / out-of-CI (the tanmatra service
      # revision is deployed above, but traffic to tanmatra.food is promoted by
      # name, not auto-latest). And once the domain is cut over to the storefront
      # service (docs/DOMAIN-CUTOVER.md), tanmatra.food stops reflecting this job
      # at all. So this is a NON-FATAL notice, not a gate — the storefront job
      # owns the domain deploy-truth post-cutover.
      - name: Domain notice (non-fatal — promotion/cutover is manual)
        run: |
          DEPLOYED=$(curl -sf https://tanmatra.food/api/build | jq -r '.sha // "unknown"' 2>/dev/null || echo "unreachable")
          echo "tanmatra.food currently serves sha: $DEPLOYED (this job deployed: ${{ github.sha }})"
          if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
            echo "NOTE: domain not on this revision — expected when promotion is pending or the domain is mapped to the storefront service."
          fi

  # Build the rebuild storefront (Next.js) image and roll the `storefront`
  # Cloud Run service. Separate service from `tanmatra` (the current SPA) — the
  # rebuild ships alongside it; traffic is cut over by domain mapping when
  # ready. The browser talks to this service's own origin and the Next server
  # proxies /api to the api-server (same-origin cookie), so no ALLOWED_ORIGINS
  # change is needed. NOTE: the plan-v2 surfaces need FLAG_PLAN_V2=true on the
  # api-server (a separate go-live switch, not flipped here).
  storefront-cloud-run:
    needs: [changes, cloud-run]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.storefront == 'true') &&
      needs.cloud-run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: storefront
      API_URL: https://wellness-foods-475157072474.asia-south2.run.app/api
      # Dish-photo origin for the /images proxy (next.config rewrites). The
      # library lives in the legacy tanmatra service's public/ dir; repoint to
      # a bucket/CDN at cutover — runtime env, no rebuild.
      IMAGE_URL: https://tanmatra-475157072474.asia-south2.run.app
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          IMAGE=asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }}
          # Custom Dockerfile. NEXT_PUBLIC_API_BASE is left empty so the browser
          # uses the same-origin /api proxy. Live checkout (SF-05) is ON: the
          # à-la-carte guest money path needs only Razorpay creds on the
          # api-server; the browser gets the Razorpay keyId from the server's
          # order response, so no Razorpay secret ships in the bundle. The
          # NEXT_PUBLIC_FIREBASE_* values (SF-03 sign-in) are PUBLIC web config —
          # the same secrets the tanmatra SPA build consumes. Async +
          # CLOUD_LOGGING_ONLY avoids VPC-SC log-streaming errors.
          cat > /tmp/storefront-cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - --build-arg
                - NEXT_PUBLIC_API_BASE=
                - --build-arg
                - NEXT_PUBLIC_LIVE_CHECKOUT=1
                # Canonical origin for robots/sitemap/canonical/OG — the production
                # domain that fronts this service post-cutover (docs/DOMAIN-CUTOVER.md).
                - --build-arg
                - NEXT_PUBLIC_SITE_URL=https://tanmatra.food
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
                - --build-arg
                - NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
                # Rewrites are baked at build time (routes-manifest), so the
                # /api and /images proxy upstreams must be build args — the
                # runtime env alone cannot enable them.
                - --build-arg
                - API_UPSTREAM=${API_URL%/api}
                - --build-arg
                - IMAGE_UPSTREAM=${IMAGE_URL}
                - -t
                - ${IMAGE}
                - -f
                - artifacts/storefront/Dockerfile
                - .
          images:
            - ${IMAGE}
          options:
            logging: CLOUD_LOGGING_ONLY
            machineType: E2_HIGHCPU_8
          EOF
          BUILD_ID=$(gcloud builds submit \
            --config /tmp/storefront-cloudbuild.yaml \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)' .)
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 50); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} --format='value(status)')
            echo "[$i/50] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"; exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          # API_BASE_URL — server components fetch the api directly.
          # API_UPSTREAM — the same-origin /api proxy target (next.config rewrites).
          # BUILD_SHA feeds /api/build — the deploy-truth endpoint. It is set at
          # deploy time (not baked into the image) so the running revision
          # always reports the commit that produced it.
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --update-env-vars "API_BASE_URL=${API_URL%/api},API_UPSTREAM=${API_URL%/api},IMAGE_UPSTREAM=${IMAGE_URL},BUILD_SHA=${{ github.sha }}" \
            --memory=512Mi \
            --cpu=1 \
            --cpu-boost \
            --quiet

      # NOTE: this service is NO LONGER a dark preview — tanmatra.food is
      # mapped to it (docs/DOMAIN-CUTOVER.md §1). Routing to latest here puts
      # the new revision in front of real customers, and since push now
      # auto-deploys this job, that happens unattended on every merge. Hence
      # the stable-revision capture below and the rollback step at the end.
      #
      # Routing explicitly (rather than relying on the deploy default) is still
      # required: a stray traffic pin once left run 30002863468 stranded at 0%,
      # the home smoke passed against the OLD revision, and only the
      # deploy-truth assert caught it.
      - name: Capture the currently-serving revision (rollback target)
        id: stable
        run: |
          STABLE_REV=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.traffic[0].revisionName)')
          echo "stable revision before this deploy: $STABLE_REV"
          echo "rev=$STABLE_REV" >> "$GITHUB_OUTPUT"

      - name: Route traffic to the new revision
        run: |
          gcloud run services update-traffic ${SERVICE} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --to-latest \
            --quiet

      - name: Smoke-test the home page renders
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "$URL/" >/dev/null; then
              echo "storefront home OK"; exit 0
            fi
            echo "home attempt $i failed, retrying..."; sleep 5
          done
          echo "storefront home never returned 200"; exit 1

      - name: Assert deployed sha (/api/build == pushed commit)
        run: |
          # Deploy-truth assertion (TNM-OPS-01 pattern): the running revision
          # must report exactly the commit this workflow deployed. Catches
          # stale revisions, failed rollouts, and env-var drift in one check.
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sf "$URL/api/build" || true)
            echo "attempt $i: $BODY"
            DEPLOYED=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
            if [ "$DEPLOYED" = "${{ github.sha }}" ]; then
              echo "deploy-truth OK: $DEPLOYED"; exit 0
            fi
            sleep 5
          done
          echo "deploy-truth FAILED: /api/build sha never matched ${{ github.sha }}"; exit 1

      # Auto-rollback. Restored from the pipeline deleted in e09c21e1 — the same
      # commit that disabled the push trigger also removed the canary, the
      # promote gate and this rollback, leaving a failed verify to simply exit
      # with the bad revision still serving 100%. That was survivable while
      # every deploy was a human watching a dispatch; it is not, now that a
      # merge ships unattended. If either check above failed, put the previous
      # revision back before anyone sees the broken one.
      - name: Roll back on failed verification
        if: failure() && steps.stable.outputs.rev != ''
        run: |
          echo "verification failed — restoring ${{ steps.stable.outputs.rev }}"
          gcloud run services update-traffic ${SERVICE} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --to-revisions "${{ steps.stable.outputs.rev }}=100" \
            --quiet
          echo "rolled back. The deploy is red on purpose — fix forward and merge again."

      # Non-fatal check of the production domain. The fatal deploy-truth above
      # runs against this service's own run.app URL. Once tanmatra.food is mapped
      # to the storefront (docs/DOMAIN-CUTOVER.md) it should serve this same sha
      # with app=tanmatra-web. Kept NON-FATAL: the domain mapping is manual infra
      # this build doesn't control, so a pre-cutover / cert-propagation mismatch
      # must not red the deploy. Flip to fatal once the domain is permanently on
      # the storefront.
      - name: Domain notice — tanmatra.food (non-fatal until cutover completes)
        run: |
          BODY=$(curl -sf https://tanmatra.food/api/build || true)
          DEPLOYED=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' 2>/dev/null || true)
          APP=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("app",""))' 2>/dev/null || true)
          echo "tanmatra.food /api/build → sha=$DEPLOYED app=$APP (storefront sha: ${{ github.sha }})"
          if [ "$DEPLOYED" = "${{ github.sha }}" ] && [ "$APP" = "tanmatra-web" ]; then
            echo "domain deploy-truth OK — tanmatra.food is on this storefront build"
          else
            echo "NOTE: tanmatra.food not yet on this storefront build (pre-cutover, or mapping/cert still propagating). Non-fatal."
          fi
