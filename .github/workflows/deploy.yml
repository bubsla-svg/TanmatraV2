name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Don't let two pushes to main race each other into Cloud Run / Firebase.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Detect which surfaces this push touched so we don't redeploy unchanged
  # services. Outputs are read by the deploy jobs below via `needs`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'artifacts/api-server/**'
              - 'lib/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'artifacts/tanmatra/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'

  # Build the api-server Docker image with Cloud Build, then roll the
  # `wellness-foods` Cloud Run service. Runs only when backend-relevant
  # files changed.
  cloud-run:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: wellness-foods
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          # Submit async to avoid VPC-SC log-streaming errors from the
          # GitHub runner. Poll build status directly instead.
          BUILD_ID=$(gcloud builds submit \
            --tag asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} \
              --format='value(status)')
            echo "[$i/40] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --update-env-vars "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }},ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }},DISABLE_SCHEDULERS=true" \
            --set-secrets "ADMIN_SESSION_SECRET=brand-tanmatra-admin-session-secret:latest,DATABASE_URL=brand-tanmatra-database-url:latest,SESSION_SECRET=brand-tanmatra-session-secret:latest" \
            --add-cloudsql-instances "${GCP_PROJECT}:asia-south2:brand-tanmatra-db" \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --quiet

      - name: Smoke-test /api/livez
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "$URL/api/livez" >/dev/null; then
              echo "livez OK"; exit 0
            fi
            echo "livez attempt $i failed, retrying..."; sleep 5
          done
          echo "livez never returned 200"; exit 1

  # Build the SPA and deploy to Firebase Hosting. The frontend talks to a
  # STABLE Cloud Run URL (not a per-deploy URL), so a backend deploy that
  # fails or crash-loops must NOT block shipping frontend fixes — otherwise
  # a broken API takes the whole site's frontend hostage. We therefore run
  # whenever web files changed, regardless of the cloud-run job's result
  # (success / skipped / failure); only a cancelled run is treated as abort.
  firebase:
    needs: [changes, cloud-run]
    if: |
      always() &&
      needs.changes.outputs.web == 'true' &&
      needs.cloud-run.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tanmatra
        run: pnpm --filter @workspace/tanmatra run build
        env:
          NODE_ENV: production
          VITE_API_BASE: https://wellness-foods-475157072474.asia-south2.run.app/api

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TANMATRA_1D763 }}
          projectId: brand-tanmatra-tmg
          channelId: live
          entryPoint: artifacts/tanmatra
