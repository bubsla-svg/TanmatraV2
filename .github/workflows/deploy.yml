name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Don't let two pushes to main race each other into the Cloud Run services.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Detect which surfaces this push touched so we don't redeploy unchanged
  # services. Outputs are read by the deploy jobs below via `needs`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'artifacts/api-server/**'
              - 'lib/**'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'artifacts/tanmatra/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'
            storefront:
              - 'artifacts/storefront/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy.yml'

  # Build the api-server Docker image with Cloud Build, then roll the
  # `wellness-foods` Cloud Run service. Runs only when backend-relevant
  # files changed.
  cloud-run:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: wellness-foods
    # Petpooja POS activation (see the Deploy step): the three
    # brand-tanmatra-petpooja-* Secret Manager secrets referenced in
    # --set-secrets MUST exist and be readable by the runtime service account
    # before this deploy runs — gcloud fails the deploy on a missing secret.
    # PETPOOJA_RESTAURANT_ID is a non-secret restaurant identifier inlined as a
    # literal in --update-env-vars (like ALLOWED_ORIGINS); the integration
    # activates once the three secrets above are present (petpoojaConfig()
    # requires all four).
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          # Submit async to avoid VPC-SC log-streaming errors from the
          # GitHub runner. Poll build status directly instead.
          BUILD_ID=$(gcloud builds submit \
            --tag asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} \
              --format='value(status)')
            echo "[$i/40] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --update-env-vars "^;^ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }};ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }};DISABLE_SCHEDULERS=true;FLAG_PLAN_V2=true;SESSION_SAMESITE=none;ALLOWED_ORIGINS=https://tanmatra.food,https://www.tanmatra.food,https://tanmatra-yftxztp3xq-em.a.run.app,https://tanmatra-475157072474.asia-south2.run.app,http://localhost:5173,http://localhost:3000;RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }};RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }};PETPOOJA_RESTAURANT_ID=cq5hnj3629;REDIS_HOST=redis-17230.crce280.asia-south1-1.gcp.cloud.redislabs.com;REDIS_PORT=17230;REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }};BULLMQ_PREFIX=prod;GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }};RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }};TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }};TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }};TWILIO_VERIFY_SERVICE_SID=${{ secrets.TWILIO_VERIFY_SERVICE_SID }};PRIVATE_OBJECT_DIR=${{ secrets.PRIVATE_OBJECT_DIR }}" \
            --set-secrets "ADMIN_SESSION_SECRET=brand-tanmatra-admin-session-secret:latest,DATABASE_URL=brand-tanmatra-database-url:latest,SESSION_SECRET=brand-tanmatra-session-secret:latest,CLINICAL_KMS_MASTER_KEY=brand-tanmatra-clinical-kms-key:latest,PETPOOJA_APP_KEY=brand-tanmatra-petpooja-app-key:latest,PETPOOJA_APP_SECRET=brand-tanmatra-petpooja-app-secret:latest,PETPOOJA_ACCESS_TOKEN=brand-tanmatra-petpooja-access-token:latest" \
            --add-cloudsql-instances "${GCP_PROJECT}:asia-south2:brand-tanmatra-db" \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --quiet

      - name: Smoke-test /api/livez
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "$URL/api/livez" >/dev/null; then
              echo "livez OK"; exit 0
            fi
            echo "livez attempt $i failed, retrying..."; sleep 5
          done
          echo "livez never returned 200"; exit 1

  # Build the SPA image and roll the `tanmatra` Cloud Run service — the
  # service the production domain (tanmatra.food) actually serves. This
  # replaces the old Firebase Hosting deploy: tanmatra.food is a Cloud Run
  # domain mapping (server: Google Frontend), NOT Firebase, so the Firebase
  # deploys never reached the live site. Deploying here, in the same pipeline
  # that runs on every push to main, makes frontend rollouts reliable instead
  # of depending on a separate Cloud Build trigger.
  #
  # Runs whenever web files changed, regardless of the cloud-run job's result
  # (the frontend targets a STABLE API URL, so a backend blip must not block
  # frontend fixes); only a cancelled run aborts it.
  frontend-cloud-run:
    needs: [changes, cloud-run]
    if: |
      always() &&
      needs.changes.outputs.web == 'true' &&
      needs.cloud-run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: tanmatra
      API_URL: https://wellness-foods-475157072474.asia-south2.run.app/api
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          IMAGE=asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }}
          # Custom Dockerfile + build-arg (VITE_API_BASE is baked into the
          # bundle), so we submit an inline build config rather than --tag.
          # Async + CLOUD_LOGGING_ONLY avoids VPC-SC log-streaming errors.
          cat > /tmp/frontend-cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - --build-arg
                - VITE_API_BASE=/api
                - --build-arg
                - BUILD_SHA=${{ github.sha }}
                - --build-arg
                - BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                - --build-arg
                - VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
                - --build-arg
                - VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
                - --build-arg
                - VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
                - --build-arg
                - VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
                - --build-arg
                - VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
                - --build-arg
                - VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
                - --build-arg
                - VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
                - --build-arg
                - VITE_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
                - -t
                - ${IMAGE}
                - -f
                - artifacts/tanmatra/Dockerfile
                - .
          images:
            - ${IMAGE}
          options:
            logging: CLOUD_LOGGING_ONLY
            machineType: E2_HIGHCPU_8
          EOF
          BUILD_ID=$(gcloud builds submit \
            --config /tmp/frontend-cloudbuild.yaml \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)' .)
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 50); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} --format='value(status)')
            echo "[$i/50] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"; exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --port 8080 \
            --update-env-vars "API_UPSTREAM=${API_URL%/api},BUILD_SHA=${{ github.sha }},BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --quiet

          # Tag the deployed revision as 'candidate'
          REV=$(gcloud run revisions list --service=${SERVICE} --region=${GCP_REGION} --project=${GCP_PROJECT} --sort-by=~metadata.creationTimestamp --limit=1 --format='value(metadata.name)')
          gcloud run services update-traffic ${SERVICE} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --set-tags candidate=$REV \
            --quiet

      - name: Verify Candidate Build Endpoint
        run: |
          CANDIDATE_URL="https://candidate---${SERVICE}-yftxztp3xq-em.a.run.app"
          DEPLOYED=$(curl -sf $CANDIDATE_URL/api/build | jq -r .sha || echo "failed")
          echo "Candidate domain build SHA: $DEPLOYED (expected: ${{ github.sha }})"
          [ "$DEPLOYED" = "${{ github.sha }}" ] || { echo "DEPLOY NOT LIVE ON CANDIDATE DOMAIN"; exit 1; }

      - name: Run Playwright CMP tests on Candidate
        run: |
          npm install -g pnpm
          pnpm install
          cd artifacts/tanmatra
          npx playwright install chromium
          PLAYWRIGHT_TEST_BASE_URL="https://candidate---${SERVICE}-yftxztp3xq-em.a.run.app" pnpm exec playwright test tests/e2e/mobile-onboarding.spec.ts

  promote-frontend:
    needs: frontend-cloud-run
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: tanmatra
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote and Verify
        run: |
          # Record current stable revision before promote
          STABLE_REV=$(gcloud run services describe ${SERVICE} --region ${GCP_REGION} --project ${GCP_PROJECT} --format="value(status.traffic[0].revisionName)")
          
          # Promote
          gcloud run services update-traffic ${SERVICE} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --to-latest \
            --quiet

          # Verify
          DEPLOYED=$(curl -sf https://tanmatra.food/api/build | jq -r .sha || echo "failed")
          echo "Live domain build SHA: $DEPLOYED (expected: ${{ github.sha }})"
          if [ "$DEPLOYED" != "${{ github.sha }}" ]; then
            echo "DEPLOY NOT LIVE ON DOMAIN. Auto-rolling back to $STABLE_REV..."
            gcloud run services update-traffic ${SERVICE} \
              --region ${GCP_REGION} \
              --project ${GCP_PROJECT} \
              --to-revisions $STABLE_REV=100 \
              --quiet
            exit 1
          fi

  # Build the rebuild storefront (Next.js) image and roll the `storefront`
  # Cloud Run service. Separate service from `tanmatra` (the current SPA) — the
  # rebuild ships alongside it; traffic is cut over by domain mapping when
  # ready. The browser talks to this service's own origin and the Next server
  # proxies /api to the api-server (same-origin cookie), so no ALLOWED_ORIGINS
  # change is needed. NOTE: the plan-v2 surfaces need FLAG_PLAN_V2=true on the
  # api-server (a separate go-live switch, not flipped here).
  storefront-cloud-run:
    needs: [changes, cloud-run]
    if: |
      always() &&
      needs.changes.outputs.storefront == 'true' &&
      needs.cloud-run.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GCP_PROJECT: brand-tanmatra-tmg
      GCP_REGION: asia-south2
      SERVICE: storefront
      API_URL: https://wellness-foods-475157072474.asia-south2.run.app/api
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          IMAGE=asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }}
          # Custom Dockerfile. NEXT_PUBLIC_API_BASE is left empty so the browser
          # uses the same-origin /api proxy. Live checkout stays off until the
          # Firebase/Razorpay browser build-args are added. Async +
          # CLOUD_LOGGING_ONLY avoids VPC-SC log-streaming errors.
          cat > /tmp/storefront-cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - --build-arg
                - NEXT_PUBLIC_API_BASE=
                - -t
                - ${IMAGE}
                - -f
                - artifacts/storefront/Dockerfile
                - .
          images:
            - ${IMAGE}
          options:
            logging: CLOUD_LOGGING_ONLY
            machineType: E2_HIGHCPU_8
          EOF
          BUILD_ID=$(gcloud builds submit \
            --config /tmp/storefront-cloudbuild.yaml \
            --project ${GCP_PROJECT} \
            --async \
            --format='value(id)' .)
          echo "Cloud Build ID: $BUILD_ID"
          for i in $(seq 1 50); do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project ${GCP_PROJECT} --format='value(status)')
            echo "[$i/50] Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then exit 0; fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"; exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Cloud Build"; exit 1

      - name: Deploy to Cloud Run
        run: |
          # API_BASE_URL — server components fetch the api directly.
          # API_UPSTREAM — the same-origin /api proxy target (next.config rewrites).
          gcloud run deploy ${SERVICE} \
            --image asia-south2-docker.pkg.dev/${GCP_PROJECT}/wellness/${SERVICE}:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --platform managed \
            --allow-unauthenticated \
            --no-traffic \
            --port 8080 \
            --update-env-vars "API_BASE_URL=${API_URL%/api};API_UPSTREAM=${API_URL%/api}" \
            --memory=512Mi \
            --cpu=1 \
            --cpu-boost \
            --quiet

      - name: Smoke-test the home page renders
        run: |
          URL=$(gcloud run services describe ${SERVICE} \
            --region ${GCP_REGION} --project ${GCP_PROJECT} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf "$URL/" >/dev/null; then
              echo "storefront home OK"; exit 0
            fi
            echo "home attempt $i failed, retrying..."; sleep 5
          done
          echo "storefront home never returned 200"; exit 1
