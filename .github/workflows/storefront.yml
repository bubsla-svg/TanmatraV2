# Storefront (rebuild skeleton) — anti-rot gates as CI from commit one.
# Phase 1: these are hard checks, not aspirations. A PR that grows a file past
# the cap, adds an unjustified "use client", or breaks the server build fails.
name: Storefront

# Trigger paths must cover EVERY workspace package the storefront compiles
# against, or a change to one of them merges without ever running the
# storefront's typecheck, build or wire tests. `artifacts/storefront/package.json`
# declares exactly four: tokens, menu-catalog, preferences-match and
# subscription-rules. The last two were missing here — which mattered most for
# subscription-rules, the package that exists specifically to hold the 24 h
# skip/swap cutoff so the API and the UI cannot drift. Editing the cutoff there
# skipped the very UI tests that assert it. Keep this list in sync with that
# package.json.
on:
  pull_request:
    paths:
      - "artifacts/storefront/**"
      - "lib/tokens/**"
      - "lib/menu-catalog/**"
      - "lib/preferences-match/**"
      - "lib/subscription-rules/**"
      - "scripts/lint-filecap.ts"
      - "scripts/lint-tokens.ts"
      - "scripts/lint-component-drift.ts"
      - "scripts/component-drift-baseline.txt"
      - "scripts/lint-landmarks.ts"
      - "scripts/lint-placeholder-assets.ts"
      - "scripts/placeholder-assets-baseline.txt"
      - "scripts/lint-dark-forks.ts"
      - "scripts/dark-forks-baseline.txt"
      - "scripts/src/lighthouse-audit.mjs"
      - "docs/stitch/stitch-screen-manifest.json"
      - "tools/verify-stitch-manifest.mjs"
      - "tools/verify-stitch-wiring.mjs"
      - "scripts/lint-stitch-markers.ts"
      - "scripts/stitch-marker-baseline.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/storefront.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/storefront/**"
      - "lib/tokens/**"
      - "lib/menu-catalog/**"
      - "lib/preferences-match/**"
      - "lib/subscription-rules/**"
      - "docs/stitch/stitch-screen-manifest.json"
      - "tools/verify-stitch-manifest.mjs"
      - "tools/verify-stitch-wiring.mjs"
      - ".github/workflows/storefront.yml"
  # Nightly window for the cross-browser job below ONLY — see that job's
  # comment. The per-PR `storefront` job explicitly opts out of this trigger so
  # a schedule does not silently re-run the whole merge gate every night.
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch: {}

jobs:
  storefront:
    # Everything except the nightly trigger. `workflow_dispatch` still runs
    # this job (and the nightly one), so a manual run exercises both.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 20 -> 30: the non-blocking Lighthouse baseline step below adds roughly
    # 3-5 min (5 routes, one throttled mobile run each, plus a second
    # `next start`). Raised deliberately rather than dropping routes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # Only typecheck -> build -> e2e is a REAL dependency chain (the build
      # needs types to compile; e2e needs a built app to serve), so only those
      # three keep the default fail-fast behaviour. Everything else — unit
      # tests, style gates — is independent and runs unconditionally below, so
      # no single failure can hide the rest.
      - name: Typecheck
        run: pnpm --filter @workspace/storefront run typecheck
      - name: Build (server-first, no money path)
        run: pnpm --filter @workspace/storefront run build
      # CUJ specs against the built app (TNM-SF-01 §6). Same specs re-run
      # against the deployed service URL at each wave gate via E2E_BASE_URL;
      # here they gate the merge on a real served build (e2e-pr.yml pattern).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: CUJ e2e (mobile) against the built app
        run: |
          PORT=3000 pnpm --filter @workspace/storefront run start &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test \
            --config artifacts/storefront/e2e/playwright.config.ts --project=mobile
      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-e2e-report
          path: playwright-report/
          retention-days: 7

      # FRONTEND AUDIT — geometry, layering and target size, measured against
      # the live DOM rather than the source.
      #
      # Promoted from opt-in to a standing gate by owner decision. It stayed
      # opt-in (RUN_FRONTEND_AUDIT=1) until now for two stated reasons, and
      # both have been answered:
      #
      #   1. "Don't gate on pre-existing debt." The five WCAG 2.2 AA
      #      target-size failures the first run found were fixed in #70, so
      #      the blocking classes now sit at zero and this gate ratchets
      #      rather than blocks. The 24-44px comfort band is still 31
      #      findings and is deliberately NOT gated — that debt is real and
      #      would make this the kind of check people delete.
      #   2. "It goes flaky on a slow runner." The settle window is
      #      wall-clock (SETTLE_MS=2000), so that risk is genuine. It is
      #      bounded here rather than hand-waved: its own server on its own
      #      port, so a hang cannot be blamed on the CUJ run, and the report
      #      is uploaded on every outcome so a red build is diagnosable from
      #      the artifact instead of by re-running locally. If it does prove
      #      flaky, the fix is to raise SETTLE_MS or narrow the gate — not to
      #      silence the step.
      #
      # Own `next start` on port 3200, following the Lighthouse step's
      # precedent: self-contained, reorderable, no hidden dependency on
      # whichever server an earlier step happened to leave running.
      - name: Frontend audit — occlusion, collapsed images, WCAG AA target size
        env:
          RUN_FRONTEND_AUDIT: "1"
        run: |
          PORT=3200 pnpm --filter @workspace/storefront run start \
            > /tmp/storefront-audit.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3200/ >/dev/null && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:3200 pnpm exec playwright test \
            --config artifacts/storefront/e2e/playwright.config.ts \
            --project=mobile frontend-audit
      # `always()`, not `failure()`: the band findings are the point of the
      # report even on a green run, and a gate whose evidence only appears
      # when it fails teaches people to fear it rather than read it.
      - name: Render + upload the frontend audit report
        if: always()
        continue-on-error: true
        run: |
          node --experimental-strip-types \
            artifacts/storefront/e2e/support/audit/render-report.ts || true
      - name: Upload frontend audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: storefront-frontend-audit
          path: artifacts/storefront/e2e/audit-report/
          retention-days: 14
          if-no-files-found: warn

      # Unit tests need no build, so they are not part of the chain above and
      # must not gate it: on the first run after the reorder this step failed
      # and took Build + e2e down with it, which is the same masking bug one
      # step to the left. `!cancelled()` keeps the suite blocking while letting
      # the build and the e2e specs report on the same run.
      #
      # Quoted so **node** expands the glob, not the shell. Actions runs `run:`
      # under bash with globstar off, where `**` is only `*` — one directory
      # level, no more and no less. All 43 files sit directly in `lib/` today,
      # so the previous `lib/*.test.ts` and this `lib/**/*.test.ts` both yield
      # 211 tests; the quoting is what keeps that true once someone adds a
      # subdirectory. Unquoted it would silently invert — bash would match the
      # nested files and drop all 43 of these.
      - name: Money-path invariants (checkout · trial · attach)
        if: ${{ !cancelled() }}
        working-directory: artifacts/api-server
        run: node --test --import tsx "../storefront/lib/**/*.test.ts"

      # ---------------------------------------------------------------------
      # STYLE / ANTI-ROT GATES — last, and unconditional.
      # ---------------------------------------------------------------------
      # These used to run BEFORE typecheck, tests, build and e2e. `lint:tokens`
      # started failing with c8dfe9ee and, because a failed `run:` aborts the
      # job, every correctness step behind it silently stopped executing — for
      # two days the only thing this job proved was that raw hex existed. The
      # "No files were found with the provided path: playwright-report/" warning
      # on each run was Playwright never starting, not a passing suite.
      #
      # They stay BLOCKING (the debt still has to be paid) but now run after the
      # signal they were hiding, and `!cancelled()` means an e2e failure cannot
      # mask them either — every gate reports on every run, in both directions.
      - name: Anti-rot — file-cap + "use client" justification
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:filecap
      - name: Token gate — no raw colours / palette classes (TNM-UIF-01 §3.4)
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:tokens
      - name: Component-drift gate — no duplicate-spelling class debt
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:component-drift
      # Both of the gates below exist because their failure mode is INVISIBLE
      # in review: <main> and <div> render identically, and a placeholder photo
      # looks like a photo. Neither typecheck nor any other gate here objects.
      - name: Landmark gate — one <main> per rendered document
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:landmarks
      - name: Placeholder-photography gate — baselined debt may only shrink
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:placeholder-assets
      # Theme-blindness gate — same invisible-in-review argument as the two
      # above: a `dark:` fork renders correctly in whichever mode the reviewer
      # happens to be in. It shipped with 522 baselined violations; those have
      # since been migrated onto semantic tokens, so the baseline is empty and
      # any `dark:` fork, Tailwind palette colour or raw white/black fails the
      # build outright. The register may only shrink — a fixed line whose
      # baseline entry is still present fails the gate as stale.
      - name: Theme-blindness gate — no new dark:/palette/raw-white drift
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:dark-forks
      # A 2026-08-13 audit found a fourth theme-blindness shape none of the
      # gates above catch: a bare bg-/text-/border-/ring- class whose name was
      # never registered in @theme inline. Tailwind emits no rule for it, so
      # the class is silently inert — no raw hex, no dark: fork, nothing the
      # other gates can see. Shipped with an empty baseline (the sweep fixed
      # all ~137 sites it found), so any new phantom class fails outright.
      - name: Unregistered-color-utility gate — no silently-inert bg-/text-/border-/ring- class
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:unregistered-color-utility
      # Same failure class as the gate above — a class that resolves to nothing
      # — one layer out: a ligature icon-font class whose font is never loaded
      # renders the LIGATURE NAME as body text. `auto_awesome` shipped visible
      # on the home page that way, plus five in the meal-feedback dialog.
      # Conditional, not a ban: use the font and load it and this passes.
      - name: Icon-font gate — no ligature icon class without its font loaded
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:icon-font
      # Law 6 (customer's language) copy gate. Internal vocabulary reads as
      # correct to whoever wrote it, so review misses it: "server-priced" is an
      # architecture guarantee, not a benefit; a raw status enum is a DB value
      # wearing a UI. The recurrence rule is surface-scoped on purpose —
      # schema/subscriptions.ts:44-52 makes "cycle"/"renews" correct after
      # conversion and a broken promise on a live trial, which a diff read in
      # isolation cannot tell apart. Comments are stripped before matching, so
      # prose about a banned term is not itself a violation, and
      # `law6-allow: <reason>` exempts a genuinely correct use.
      - name: Law 6 copy gate — no internal vocabulary on customer surfaces
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:copy-vocabulary
      # Stitch traceability gates. The manifest verifier proves the 74-entry
      # manifest is schema-valid; the wiring verifier proves its filesystem
      # claims match the repo. Honest missing/partial/blocked entries PASS —
      # only contradictions (stale paths, verified-without-evidence, duplicate
      # IDs) fail. Runtime reachability is test:stitch-runtime's job, not these.
      - name: Stitch manifest — schema validity
        if: ${{ !cancelled() }}
        run: node tools/verify-stitch-manifest.mjs
      - name: Stitch wiring — manifest claims match the repository
        if: ${{ !cancelled() }}
        run: node tools/verify-stitch-wiring.mjs
      # Closes the gap the two verifiers above leave open: neither reads the
      # SOURCE of an implemented screen, so a template adoption that eats the
      # marked wrapper element (the exact break the Astryx PDP rebuild shipped
      # in dc80404, caught one commit later only by a manually-run e2e spec)
      # stayed green here. This gate statically requires every verified
      # screen's data-screen-id in the union of its manifest-claimed artifacts.
      # Presence-in-source only — runtime reachability stays e2e's job.
      - name: Stitch markers — implemented screens carry their data-screen-id
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:stitch-markers

      # An undeclared custom property is invalid at computed-value time: the
      # browser drops the declaration and the styling silently does not happen
      # — no warning, no build error, and a diff that reads as correct. This
      # repo has already paid for it once (globals.css records five routes
      # rendering with no gutter because `--spacing-gutter` was never
      # registered), and it was found by grepping the built stylesheet.
      - name: CSS vars — every custom property used is actually declared
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:css-vars

      # A raw <a> to an app route is a full document load: the router unmounts,
      # providers re-run, the query cache is discarded, scroll position is lost
      # and nothing prefetches. It is correct HTML and correct in a plain React
      # app, so nothing in a diff distinguishes it — which is how ten of them
      # accumulated, including every card in the marketplace and recipe grids.
      - name: Client nav — internal links go through the router
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/storefront run lint:client-nav

      # ---------------------------------------------------------------------
      # PERFORMANCE BASELINE — DELIBERATELY NON-BLOCKING. DO NOT FLIP YET.
      # ---------------------------------------------------------------------
      # WEB-APP-ENHANCEMENT-PLAN Tier 2 #14. `scripts/src/lighthouse-audit.mjs`
      # audits five storefront routes — / · /menu · /dish/quinoa-khichdi ·
      # /checkout · /account — for accessibility, best-practices, and gzipped
      # JS/CSS transfer size against the plan's starting budgets:
      #   landing (/)              < 150 KB JS · 30 KB CSS
      #   app (/menu /dish /checkout /account)
      #                            < 300 KB JS · 50 KB CSS
      #
      # It cannot fail this job. TWO independent reasons, both intentional:
      #   1. `continue-on-error: true` on this step — a non-zero exit is
      #      recorded and the job still goes green.
      #   2. The script defaults to baseline mode (`LH_ENFORCE` unset) and
      #      exits 0 even when a budget is breached; it prints the violations.
      #
      # WHAT MUST BE TRUE BEFORE THIS BECOMES BLOCKING — all four, in order:
      #   a. 2-3 WEEKS of real baseline data collected from main. The plan
      #      requires this explicitly; today nobody knows what these routes
      #      actually weigh, so the 150/300 KB numbers are a guess, not a
      #      measurement. Read them off the uploaded
      #      `storefront-lighthouse-baseline` artifacts.
      #   b. The budgets in the script's BUDGETS map re-derived from that data
      #      (either the routes fit and the numbers stay, or they don't and the
      #      numbers change with a written justification — not silently).
      #   c. The run demonstrably NOT flaky: no route error and no budget
      #      flip-flop across consecutive main runs on unchanged code.
      #   d. The `/dish` profile classification settled — it is provisionally
      #      `app`, and the plan does not assign it a profile.
      # Then, and only then: set `LH_ENFORCE: "1"` below and delete
      # `continue-on-error`. Both, or the gate is still a no-op.
      #
      # Runs on its own `next start` (port 3100) rather than reusing the e2e
      # server, so this step is self-contained and can be reordered or lifted
      # into its own job without a hidden dependency. Chrome comes from the
      # runner image (`google-chrome-stable` on PATH); the script probes for it
      # and honours CHROME_PATH.
      - name: Performance baseline — Lighthouse (NON-BLOCKING, see comment)
        continue-on-error: true
        env:
          LH_BASE: http://127.0.0.1:3100
        run: |
          PORT=3100 pnpm --filter @workspace/storefront run start \
            > /tmp/storefront-lighthouse.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100/ >/dev/null && break
            sleep 1
          done
          node scripts/src/lighthouse-audit.mjs
      - name: Upload Lighthouse baseline reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: storefront-lighthouse-baseline
          path: .local/lighthouse-reports/
          # Longer than the e2e report's 7 days on purpose: the whole point is
          # to accumulate 2-3 weeks of history before (a) above can be answered.
          retention-days: 30
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # CROSS-BROWSER — NIGHTLY ONLY, PRIMARY FUNNEL SPEC ONLY.
  # -------------------------------------------------------------------------
  # WEB-APP-ENHANCEMENT-PLAN Tier 2 #15. Two coverage bounds, stated here
  # rather than left to be discovered (AGENT_WORKING_AGREEMENT §6 — silent
  # truncation reads as "done" when it isn't):
  #
  #   BOUND 1 — nightly, not per-PR. Gecko and WebKit run on the 02:37 UTC
  #             schedule and on manual dispatch. A PR is NOT checked against
  #             them. A Firefox/Safari-only regression is therefore caught up
  #             to ~24 h after it merges, not at review time. That is the
  #             deliberate trade for per-PR wall-clock.
  #   BOUND 2 — `core-funnel.spec.ts` only, not the 14-spec CUJ suite, and not
  #             the VRT spec. Enforced in `playwright.config.ts` via each
  #             project's `testMatch`, so it holds even if someone runs the
  #             config without a filter.
  #
  # Not covered at all by this job: real iOS/Android Safari and Chrome (WebKit
  # and Chromium builds are engine proxies, not the shipping browsers), and
  # every non-funnel CUJ on non-Chromium engines.
  cross-browser-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build (server-first, no money path)
        run: pnpm --filter @workspace/storefront run build
      - name: Install Playwright browsers (firefox + webkit)
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Primary funnel on Gecko + WebKit
        run: |
          PORT=3000 pnpm --filter @workspace/storefront run start &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test \
            --config artifacts/storefront/e2e/playwright.config.ts \
            --project=firefox --project=webkit
      - name: Upload cross-browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-cross-browser-report
          path: playwright-report/
          retention-days: 7
