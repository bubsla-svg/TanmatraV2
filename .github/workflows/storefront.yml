# Storefront (rebuild skeleton) — anti-rot gates as CI from commit one.
# Phase 1: these are hard checks, not aspirations. A PR that grows a file past
# the cap, adds an unjustified "use client", or breaks the server build fails.
name: Storefront

on:
  pull_request:
    paths:
      - "artifacts/storefront/**"
      - "lib/tokens/**"
      - "lib/menu-catalog/**"
      - "scripts/lint-filecap.ts"
      - "scripts/lint-tokens.ts"
      - ".github/workflows/storefront.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/storefront/**"
      - "lib/tokens/**"
      - ".github/workflows/storefront.yml"
  workflow_dispatch: {}

jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Anti-rot — file-cap + "use client" justification
        run: pnpm --filter @workspace/storefront run lint:filecap
      - name: Token gate — no raw colours / palette classes (TNM-UIF-01 §3.4)
        run: pnpm --filter @workspace/storefront run lint:tokens
      - name: Typecheck
        run: pnpm --filter @workspace/storefront run typecheck
      - name: Money-path invariants (checkout · trial · attach)
        working-directory: artifacts/api-server
        run: node --test --import tsx ../storefront/lib/*.test.ts
      - name: Build (server-first, no money path)
        run: pnpm --filter @workspace/storefront run build
      # CUJ specs against the built app (TNM-SF-01 §6). Same specs re-run
      # against the deployed service URL at each wave gate via E2E_BASE_URL;
      # here they gate the merge on a real served build (e2e-pr.yml pattern).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: CUJ e2e (mobile) against the built app
        run: |
          PORT=3000 pnpm --filter @workspace/storefront run start &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test \
            --config artifacts/storefront/e2e/playwright.config.ts --project=mobile
      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-e2e-report
          path: playwright-report/
          retention-days: 7
