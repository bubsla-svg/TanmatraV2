name: Debug Logs

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision name (optional)'
        required: false
        default: ''
      build_id:
        description: 'Cloud Build ID (optional)'
        required: false
        default: ''

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Firebase Hosting API
        run: |
          gcloud services enable firebasehosting.googleapis.com --project brand-tanmatra-tmg
