name: Deprovision Unused Firebase Site

on:
  workflow_dispatch:

jobs:
  deprovision:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete Firebase Hosting Site
        run: |
          # Install Firebase CLI
          npm install -g firebase-tools
          
          # Create a dummy firebase.json
          echo '{"hosting":{"public":"public"}}' > firebase.json
          
          # Delete the unused site
          firebase hosting:sites:delete brand-tanmatra-tmg-web --project brand-tanmatra-tmg --force --token "${{ secrets.FIREBASE_TOKEN }}"
