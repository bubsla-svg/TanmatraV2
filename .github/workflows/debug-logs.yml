name: Cleanup and Verification

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Triggers and Redis in brand-tanmatra-tmg
        run: |
          echo "=== Cloud Build Triggers ==="
          gcloud builds triggers list --project brand-tanmatra-tmg || true
          
          echo "=== Redis Instances ==="
          gcloud redis instances list --project brand-tanmatra-tmg --region asia-south2 || true
          gcloud redis instances list --project brand-tanmatra-tmg --region asia-south1 || true

      - name: Verify Old Project omnismtp
        run: |
          echo "=== Project omnismtp Details ==="
          gcloud projects describe omnismtp || echo "No access to omnismtp"
          
          echo "=== Cloud Run Services in omnismtp ==="
          gcloud run services list --project omnismtp || true
          
          echo "=== Cloud SQL Instances in omnismtp ==="
          gcloud sql instances list --project omnismtp || true

      - name: Verify Firebase Hosting Sites
        run: |
          # Install Firebase CLI
          npm install -g firebase-tools
          
          echo "=== Firebase Projects ==="
          firebase projects:list --token "${{ secrets.FIREBASE_TOKEN }}" || npx firebase-tools projects:list || true
          
          echo "=== Firebase Hosting Sites in brand-tanmatra-tmg ==="
          firebase hosting:sites:list --project brand-tanmatra-tmg --token "${{ secrets.FIREBASE_TOKEN }}" || npx firebase-tools hosting:sites:list --project brand-tanmatra-tmg || true
