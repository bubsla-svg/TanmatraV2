name: Sync fork from upstream

# Keeps this fork's main (and optionally other branches) in sync with
# chan8822/Wellness-Foods. Runs daily and on demand.
#
# Auth: if the upstream repo is private, create an Actions secret
# UPSTREAM_SYNC_TOKEN — a PAT with read access to chan8822/Wellness-Foods.
# If upstream is public, the default GITHUB_TOKEN is enough and the
# secret can be omitted.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      branches:
        description: "Space-separated upstream branches to mirror (fast-forward main; other branches are force-mirrored)"
        required: false
        default: "main"

env:
  UPSTREAM_REPO: chan8822/Wellness-Foods

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branches from upstream
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' && secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          BRANCHES: ${{ github.event.inputs.branches || 'main' }}
        run: |
          set -euo pipefail
          git remote add upstream "https://x-access-token:${UPSTREAM_TOKEN}@github.com/${UPSTREAM_REPO}.git"
          for branch in $BRANCHES; do
            echo "::group::Syncing $branch"
            if ! git fetch upstream "$branch"; then
              echo "::error::Could not fetch '$branch' from $UPSTREAM_REPO — check the branch name and UPSTREAM_SYNC_TOKEN access"
              exit 1
            fi
            if [ "$branch" = "main" ]; then
              # Never rewrite fork main history: fast-forward only.
              git checkout main
              git merge --ff-only FETCH_HEAD
              git push origin main
            else
              # Feature branches mirror upstream exactly.
              git push --force origin "FETCH_HEAD:refs/heads/$branch"
            fi
            echo "::endgroup::"
          done
