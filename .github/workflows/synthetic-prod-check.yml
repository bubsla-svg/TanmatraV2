# Synthetic production monitoring — the eyes on prod that development
# sandboxes don't have. Runs the real funnel against the live site in
# Chromium AND WebKit (the engine where cross-site-cookie login breakage
# lived undetected) every 2 hours and after every deploy completes.
name: Synthetic Prod Check

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: write

# Pinned in ONE place. It is both the package this installs and the cache key
# below; two literals would drift the moment someone bumped one of them, and a
# stale key silently means "never hits" rather than a visible failure.
env:
  PLAYWRIGHT_VERSION: "1.49.1"

jobs:
  synthetic:
    runs-on: ubuntu-latest
    # For deploy-triggered runs, only check after successful deploys.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # COST: this workflow runs every 2 hours plus after every deploy — the
      # highest run count in the repo — and re-downloaded two browser engines
      # each time. The download is cached; the install command is unchanged and
      # still runs unconditionally.
      #
      # Unconditional matters MORE here than anywhere else in this repo: this is
      # the production monitor, so a job that fails for a CI-infrastructure
      # reason reads as "prod is broken". A cache miss must cost seconds, never
      # a false alarm.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-webkit-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright (chromium + webkit)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium webkit

      - name: Run synthetic checks against production
        env:
          PROD_URL: https://tanmatra.food
        run: node scripts/synthetic-check.mjs

      - name: Publish report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f synthetic-report.md ]; then
            BODY=$(python3 -c "import json,sys; print(json.dumps({'body': open('synthetic-report.md').read()}))")
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -d "$BODY" >/dev/null && echo "report posted"
          fi
