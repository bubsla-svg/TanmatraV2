# Quality gates (PR gate). Turns the CRO-spec regression guards from
# hand-run scripts into enforced CI checks:
#   - no hardcoded color literals (design-token binding, spec A3)
#   - no hardcoded ₹ price literals (spec A4.2)
#   - no prohibited geography strings / stale copyright in the built bundle (spec A1)
#   - every money-path manifest route serves real prerendered HTML with
#     h1 + a progressive CTA anchor and no JS-required fallback (spec A1.4)
# Complements e2e-pr.yml (funnel drive) and synthetic-prod-check.yml (post-deploy).
name: Quality gates

on:
  pull_request:
    paths:
      - "artifacts/tanmatra/**"
      - "scripts/lint-colors.ts"
      - "scripts/lint-prices.ts"
      - "scripts/lint-geography.ts"
      - "scripts/src/verify-dish-integrity.ts"
      - "scripts/src/verify-allergen-gate.ts"
      - "scripts/src/verify-honest-claims.ts"
      - "lib/**"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No explicit version — root package.json's packageManager pins pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Source-scanning gates — no build needed.
      - name: Lint — color literals (design tokens)
        run: pnpm --filter "@workspace/tanmatra" run lint:colors

      - name: Lint — hardcoded price literals
        run: pnpm --filter "@workspace/tanmatra" run lint:prices

      # No secret may be interpolated into a `run:` script. GitHub substitutes
      # it as literal text and bash then expands it, so a `$` in the value is
      # eaten and shell syntax in the value is executed. This is not
      # theoretical: it silently corrupted ADMIN_PASSWORD_HASH on every deploy
      # and locked the admin console's own operator out.
      - name: Lint — workflow secrets are env-bound, not shell-interpolated
        run: pnpm run lint:workflow-secrets

      # Dish-data integrity: no contradictory allergen / diet / serving signals
      # on the clinical surface (e.g. an "Eggless" dish declaring an egg allergen,
      # or a cold smoothie carrying "reheat" copy). Source-scanning, no build.
      - name: Gate — dish-data integrity
        run: pnpm --filter "@workspace/scripts" run verify-dish-integrity

      - name: Gate — allergen fail-closed safety engine (G9 / REM-V1-01)
        run: pnpm --filter "@workspace/scripts" run verify-allergen-gate

      - name: Gate — honest claims (no unbacked "RD Verified" dish badge, T2.1)
        run: pnpm --filter "@workspace/scripts" run verify-honest-claims

      # Schema/migration drift guard. Every change to the Drizzle schema must
      # ship with a committed migration: `drizzle-kit generate` writes a new
      # migration file whenever the schema is ahead of the committed snapshot,
      # so a dirty tree here means a migration was forgotten. Catches the
      # "schema changed but the migration to apply it was never committed"
      # class. (It does NOT verify prod has applied the migrations — that's the
      # job of a deploy-time `drizzle-kit migrate` step.) The dummy DATABASE_URL
      # only satisfies drizzle.config.ts; `generate` diffs offline and never
      # connects.
      - name: Gate — Drizzle schema has a committed migration (no drift)
        run: |
          DATABASE_URL="postgres://drift:guard@127.0.0.1:5432/drift_guard" \
            pnpm --filter "@workspace/db" exec drizzle-kit generate --config ./drizzle.config.ts --name ci_drift_guard
          if [ -n "$(git status --porcelain lib/db/drizzle)" ]; then
            echo "::error::Drizzle schema changed without a committed migration. Run 'pnpm --filter @workspace/db exec drizzle-kit generate' locally and commit lib/db/drizzle/*."
            git --no-pager status --short lib/db/drizzle
            exit 1
          fi
          echo "Drizzle schema and committed migrations are in sync."

      # Build once; the geography lint and SSR checker scan build/client.
      - name: Build SPA
        run: pnpm --filter "@workspace/tanmatra" run build

      - name: Lint — geography / stale copyright (built bundle)
        run: pnpm --filter "@workspace/tanmatra" run lint:geography

      - name: SSR — money-path routes serve real HTML (no-JS)
        run: pnpm --filter "@workspace/tanmatra" run test:ssr
