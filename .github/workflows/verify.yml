          ./src/lib/ai/agents/ops.updateOrderStatus.test.ts
          ./src/routes/marketplace.checkout.test.ts
          ./src/routes/marketplace.paymentsIntegration.test.ts
          ./src/routes/marketplace.items.test.ts
