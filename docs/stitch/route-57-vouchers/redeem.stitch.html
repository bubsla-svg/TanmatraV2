    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest text-on-surface antialiased font-body-base min-h-screen selection:bg-primary selection:text-ink-on-gold flex flex-col pt-8 pb-safe">
<!-- Header Section -->
<header class="px-mobile-margin mb-8 space-y-2">
<h2 class="text-primary font-label-small-caps text-label-small-caps uppercase tracking-widest">Wallet</h2>
<h1 class="text-on-surface font-headline-md text-headline-md font-semibold tracking-tight">Redeem a voucher</h1>
<p class="text-on-surface-variant font-body-muted text-body-muted">Enter your promo code to credit your account wallet.</p>
</header>
<main class="flex-1 px-mobile-margin space-y-6">
<!-- Wallet Balance Card -->
<section class="bg-graphite-surface border border-whisper-hairline rounded-[1rem] p-card-padding flex flex-col gap-2">
<span class="text-on-surface-variant font-label-small-caps text-label-small-caps uppercase tracking-widest">Wallet balance</span>
<div class="text-on-surface font-clinical-data text-[2rem] leading-none tracking-tight font-semibold">
                ₹150
            </div>
</section>
<!-- Redeem Card -->
<section class="bg-graphite-surface border border-whisper-hairline rounded-[1rem] p-card-padding space-y-5">
<div class="relative">
<label class="sr-only" for="promo-code">Voucher Code</label>
<input class="w-full bg-surface-container-lowest border-whisper-hairline border rounded-[0.5rem] px-4 py-3 text-on-surface font-clinical-data text-clinical-data uppercase tracking-widest placeholder-muted-steel focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="promo-code" placeholder="ENTER CODE" type="text" value="NEWYEAR150"/>
</div>
<button class="w-full bg-primary-container text-ink-on-gold rounded-full py-3.5 font-label-small-caps text-label-small-caps uppercase tracking-widest font-bold scale-[0.98] active:scale-95 transition-transform duration-200 ease-out hover:opacity-90">
                Redeem
            </button>
<!-- Success State Indicator -->
<div class="flex items-center gap-2 pt-2 border-t border-whisper-hairline">
<span class="material-symbols-outlined text-sage-signal text-[1.25rem]">check_circle</span>
<span class="text-sage-signal font-body-muted text-body-muted">₹150 added to your wallet</span>
</div>
</section>
<!-- Vouchers List -->
<section class="space-y-4 pt-4">
<h3 class="text-on-surface-variant font-label-small-caps text-label-small-caps uppercase tracking-widest px-2">Your vouchers</h3>
<div class="bg-graphite-surface border border-whisper-hairline rounded-[1rem] divide-y divide-whisper-hairline overflow-hidden">
<!-- Voucher Item 1 -->
<div class="p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors">
<div class="flex flex-col gap-1">
<span class="text-on-surface font-clinical-data text-clinical-data tracking-wide">SAVE50</span>
<span class="text-muted-steel font-body-muted text-[0.75rem]">Redeemed</span>
</div>
<div class="text-on-surface font-clinical-data text-clinical-data tabular-nums">
                        ₹50
                    </div>
</div>
<!-- Voucher Item 2 -->
<div class="p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors">
<div class="flex flex-col gap-1">
<span class="text-on-surface font-clinical-data text-clinical-data tracking-wide">WELCOME100</span>
<span class="text-muted-steel font-body-muted text-[0.75rem]">Redeemed</span>
</div>
<div class="text-on-surface font-clinical-data text-clinical-data tabular-nums">
                        ₹100
                    </div>
</div>
<!-- Voucher Item 3 -->
<div class="p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors">
<div class="flex flex-col gap-1">
<span class="text-on-surface font-clinical-data text-clinical-data tracking-wide">NEWYEAR150</span>
<span class="text-sage-signal font-body-muted text-[0.75rem]">Just added</span>
</div>
<div class="text-primary font-clinical-data text-clinical-data tabular-nums font-semibold">
                        ₹150
                    </div>
</div>
</div>
</section>
</main>
