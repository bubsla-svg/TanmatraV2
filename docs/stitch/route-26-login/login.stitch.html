<style>
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
        
        body {
            background-color: #0a0a0a; /* Fallback for obsidian canvas */
            color: #F5F5F4;
            font-family: 'Satoshi', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .clinical-data-nums {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen bg-background flex items-center justify-center p-mobile-margin md:p-desktop-margin selection:bg-primary-container selection:text-ink-on-gold">
<main class="w-full max-w-[400px] flex flex-col gap-6 relative z-10">
<!-- Primary Sign In Card -->
<article class="bg-graphite-surface border border-whisper-hairline rounded-3xl p-6 md:p-8 shadow-2xl">
<header class="mb-8">
<h1 class="text-[1.75rem] font-medium text-off-white-ink mb-2 leading-tight">Sign in</h1>
<p class="text-body-muted font-body-muted text-muted-steel">A code by SMS, no passwords</p>
</header>
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label-small-caps text-label-small-caps text-muted-steel uppercase tracking-widest" for="phone">Phone number</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-muted-steel clinical-data-nums font-clinical-data text-clinical-data select-none">+1</span>
<input autocomplete="tel" class="w-full bg-surface-container-lowest border border-whisper-hairline rounded-xl py-3 pl-12 pr-4 text-off-white-ink clinical-data-nums font-clinical-data text-clinical-data focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all placeholder:text-surface-variant h-12" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<button class="w-full bg-primary-container text-ink-on-gold font-body-base text-body-base font-medium rounded-full py-3 px-6 active:scale-[0.98] transition-all duration-200 ease-out hover:opacity-90 flex items-center justify-center gap-2 h-12" type="button">
                    Send code
                    <span class="material-symbols-outlined text-[1.25rem]">arrow_forward</span>
</button>
</form>
<!-- Empty div for widget verification -->
<div class="mt-4 min-h-[40px] rounded-lg" id="verification-widget-container"></div>
</article>
<!-- Secondary Fallback Card -->
<article class="bg-graphite-surface border border-whisper-hairline rounded-2xl p-5 shadow-lg flex flex-col gap-4">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-clay-danger shrink-0 mt-0.5 text-[1.25rem]">info</span>
<p class="text-body-muted font-body-muted text-clay-danger leading-relaxed">
                    Sign-in is temporarily unavailable. You can order individual dishes from the menu meanwhile.
                </p>
</div>
<button class="w-full bg-primary-container text-ink-on-gold font-body-base text-body-base font-medium rounded-full py-2.5 px-6 active:scale-[0.98] transition-all duration-200 ease-out hover:opacity-90" type="button">
                Browse the menu
            </button>
</article>
</main>
<!-- Decorative ambient glow behind cards -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center">
<div class="w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[100px] opacity-30 mix-blend-screen"></div>
</div>
</body></html>
