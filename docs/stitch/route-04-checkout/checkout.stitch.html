<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#353534",
                    "surface-container-low": "#1c1b1b",
                    "glass": "rgba(23, 23, 23, 0.72)",
                    "surface-bright": "#3a3939",
                    "secondary-fixed": "#e5e2e1",
                    "on-tertiary-fixed": "#021453",
                    "tertiary": "#c2cbff",

                    "on-surface": "#e5e2e1",
                    "sage-signal": "#7D9E7E",
                    "surface-variant": "#353534",
                    "on-secondary-fixed": "#1c1b1b",
                    "hairline": "rgba(255, 255, 255, 0.06)",
                    "outline": "#99907c",
                    "on-secondary": "#313030",
                    "on-tertiary-fixed-variant": "#344280",
                    "primary-fixed-dim": "#e9c349",
                    "tertiary-fixed-dim": "#b8c3ff",
                    "error-container": "#93000a",
                    "surface-container-high": "#2a2a2a",
                    "surface": "#171717",
                    "inverse-primary": "#735c00",
                    "inverse-on-surface": "#313030",
                    "on-background": "#e5e2e1",
                    "on-primary": "#3c2f00",
                    "primary-fixed": "#ffe088",
                    "primary": "#f2ca50",
                    "on-secondary-container": "#b7b4b4",
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary-fixed-variant": "#574500",
                    "on-error": "#690005",
                    "on-surface-variant": "#d0c5af",
                    "canvas": "#0A0A0A",
                    "on-tertiary-container": "#32407e",
                    "ink-on-gold": "#111318",
                    "tertiary-container": "#a1aff4",
                    "tertiary-fixed": "#dde1ff",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-tertiary": "#1c2b68",
                    "surface-container": "#201f1f",
                    "primary-container": "#d4af37",
                    "inverse-surface": "#e5e2e1",
                    "surface-dim": "#131313",
                    "secondary-container": "#474746",
                    "outline-variant": "#4d4635",
                    "on-error-container": "#ffdad6",
                    "ember-warning": "#B6892F",
                    "error": "#ffb4ab",
                    "surface-tint": "#e9c349",
                    "clay-danger": "#B0655A",
                    "secondary": "#c8c6c5",
                    "on-primary-container": "#554300",
                    "surface-container-lowest": "#0e0e0e",
                    "ink-secondary": "#A3A3A3",
                    "background": "#131313",
                    "on-primary-fixed": "#241a00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "1.5rem",
                    "card-padding": "1.5rem",
                    "section-gap": "clamp(3rem, 8vw, 6rem)",
                    "container-max": "1280px"
            },
            "fontFamily": {
                    "headline-md": ["Satoshi"],
                    "headline-lg-mobile": ["Satoshi"],

                    "body-lg": ["Satoshi"],
                    "label-caps": ["Satoshi"],
                    "clinical-data": ["JetBrains Mono"],
                    "headline-lg": ["Satoshi"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "500"}],
                    "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],

                    "headline-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: #F5F5F4;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .bg-glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3);
        }
        /* Custom scrollbar for clinical aesthetics */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #353534; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-body-lg overflow-x-hidden selection:bg-primary/30">
<!-- TopAppBar (Predicted Shared Component) -->
<header class="fixed top-0 w-full z-50 bg-glass backdrop-blur-md border-b border-hairline">
<div class="flex items-center px-gutter h-16 max-w-container-max mx-auto">
<button class="mr-4 hover:opacity-80 transition-opacity scale-[0.98] active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-[28px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Checkout</h1>
</div>
</header>
<main class="pt-24 pb-48 px-gutter max-w-lg mx-auto min-h-screen">
<!-- Step 01: Progress Dots -->
<section class="flex justify-center items-center gap-3 mb-10">
<div class="w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(242,202,80,0.4)]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div>
</section>
<!-- Step 02: Identity Island (PhoneAuth) -->
<section class="mb-10">
<div class="bg-surface rounded-[2rem] border border-hairline p-8 shadow-black/40">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<h2 class="font-headline-md text-headline-md text-ink-primary">Identity</h2>
</div>
<p class="text-ink-secondary mb-8 font-body-sm">Enter mobile to continue</p>
<div class="relative group">
<div class="flex items-center bg-surface-container-low border border-hairline rounded-xl px-4 py-3 focus-within:border-primary transition-colors">
<span class="font-clinical-data text-clinical-data text-primary mr-3">+91</span>
<div class="h-4 w-[1px] bg-hairline mr-4"></div>
<input class="bg-transparent border-none p-0 w-full font-clinical-data text-clinical-data text-ink-primary placeholder:text-surface-container-highest focus:ring-0" placeholder="000 000 0000" type="tel"/>
</div>
</div>
<div class="mt-8 flex justify-end">
<button class="font-label-caps text-label-caps text-primary tracking-widest uppercase hover:opacity-80 transition-opacity flex items-center gap-2">
                        Send OTP
                        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</div>
</section>
<!-- Step 03: Order Summary -->
<section class="mb-20">
<h3 class="font-label-caps text-label-caps text-ink-secondary mb-6 tracking-[0.2em] uppercase">Current Order</h3>
<div class="space-y-6">
<!-- Item 1 -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-body-lg text-ink-primary">Keto-Cleanse Bowl</span>
<span class="text-ink-secondary text-body-sm font-light mt-1">x 1</span>
</div>
<span class="font-clinical-data text-clinical-data text-on-surface">₹1450</span>
</div>
<div class="h-px w-full bg-hairline"></div>
<!-- Item 2 -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-body-lg text-ink-primary">Miso Glazed Tempeh</span>
<span class="text-ink-secondary text-body-sm font-light mt-1">x 1</span>
</div>
<span class="font-clinical-data text-clinical-data text-on-surface">₹1200</span>
</div>
<!-- Subtotal -->
<div class="pt-8 flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-headline-md text-headline-md text-ink-primary">Subtotal</span>
<span class="font-clinical-data text-[20px] font-bold text-primary">₹2650</span>
</div>
<p class="text-surface-container-highest font-body-sm italic text-right">Server bills the final total</p>
</div>
</div>
</section>
</main>
<!-- Sticky Footer Container -->
<div class="fixed bottom-0 left-0 w-full z-50">
<!-- Sticky Footer Action Bar -->
<div class="bg-glass backdrop-blur-md border-t border-hairline py-4 px-gutter">
<div class="max-w-container-max mx-auto flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-ink-secondary tracking-widest uppercase mb-0.5">Est. Total</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-md font-bold text-ink-primary">₹</span>
<span class="font-clinical-data text-headline-md font-bold text-ink-primary">2650</span>
</div>
</div>
<!-- DISABLED PAY CTA -->
<button class="bg-primary text-ink-on-gold px-10 py-4 rounded-full font-label-caps text-label-caps uppercase tracking-widest opacity-50 grayscale cursor-not-allowed transition-all shadow-[0_8px_24px_-8px_rgba(212,175,55,0.4)]" disabled="">
                    Pay Now
                </button>
</div>
</div>
<!-- BottomNavBar (Predicted Shared Component - Visual Only) -->
<nav class="h-[4rem] bg-surface border-t border-hairline flex justify-around items-center px-4 pb-safe shadow-black/40">
<div class="flex flex-col items-center justify-center text-ink-secondary opacity-40">
<span class="material-symbols-outlined mb-1">restaurant_menu</span>
<span class="font-label-caps text-[10px]">Plan</span>
</div>
<div class="flex flex-col items-center justify-center text-ink-secondary opacity-40">
<span class="material-symbols-outlined mb-1">outdoor_grill</span>
<span class="font-label-caps text-[10px]">Kitchen</span>
</div>
<div class="flex flex-col items-center justify-center text-ink-secondary opacity-40">
<span class="material-symbols-outlined mb-1">biotech</span>
<span class="font-label-caps text-[10px]">Labs</span>
</div>
<div class="flex flex-col items-center justify-center text-ink-secondary opacity-40">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-caps text-[10px]">Profile</span>
</div>
</nav>
</div>
<!-- Micro-interaction Scripts -->
<script>
        // Subtle input focus animation and hover feedback
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary');
                input.parentElement.classList.add('shadow-[0_0_12px_rgba(212,175,55,0.1)]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary');
                input.parentElement.classList.remove('shadow-[0_0_12px_rgba(212,175,55,0.1)]');
            });
        });

        // Prevention of accidental clicks on disabled button
        document.querySelector('button[disabled]').addEventListener('click', (e) => {
            e.preventDefault();
        });
    </script>
</body></html>
