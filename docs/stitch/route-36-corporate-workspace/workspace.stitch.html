</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Monthly meal budget</p>
</div>
<!-- 2. Admin Action -->
<a class="inline-flex items-center gap-base text-primary font-body-md text-body-md font-medium hover:opacity-80 transition-opacity px-base py-xs mb-lg" href="#">

</a>

<span class="bg-positive-bg text-positive-text font-data-sm text-data-sm font-semibold px-xs py-base rounded-full">Picks open</span>
</div>
<!-- Card 2 -->

<span class="border border-outline-variant text-on-surface-variant font-data-sm text-data-sm px-xs py-base rounded-full">Picks closed</span>

</div>
</section>
