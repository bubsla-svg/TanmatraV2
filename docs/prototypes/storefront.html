<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanmatra — Storefront Prototype v1 (money path + subscription core)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   TANMATRA · STOREFRONT PROTOTYPE · .tnm2 TOKEN LAYER
   --tnm-action #E89A3E  → CONFIRMED System-B saffron
   --tnm-alert  #DC8773  → error value per Stitch brief §1 extract
   ink / sage / caution  → PLACEHOLDERS under correct token names;
   swap against theme.css (see wiring guide W5).
   ═══════════════════════════════════════════════════════════════ */
:root{
  --tnm-backdrop:#0A0D0F;
  --tnm-surface-ink:#10161A;        /* PLACEHOLDER */
  --tnm-surface-ink-2:#171F25;      /* PLACEHOLDER */
  --tnm-surface-ink-3:#1E2830;      /* PLACEHOLDER */
  --tnm-border:rgba(255,255,255,.09);
  --tnm-border-strong:rgba(255,255,255,.17);
  --tnm-text-primary:#F1EEE8;
  --tnm-text-secondary:#A9B2B7;
  --tnm-text-faint:#77828A;
  --tnm-action:#E89A3E;             /* CONFIRMED */
  --tnm-action-ink:#221302;
  --tnm-action-dim:rgba(232,154,62,.14);
  --tnm-sage:#8CBB9B;               /* PLACEHOLDER */
  --tnm-sage-dim:rgba(140,187,155,.14);
  --tnm-caution:#E2B54B;            /* PLACEHOLDER */
  --tnm-caution-dim:rgba(226,181,75,.13);
  --tnm-alert:#DC8773;              /* per brief §1 */
  --tnm-alert-dim:rgba(220,135,115,.15);
  --tnm-mark-veg:#3E8E5A;           /* FSSAI veg */
  --tnm-mark-nonveg:#B4552F;        /* FSSAI non-veg */
  --tnm-font-sans:'Inter',system-ui,sans-serif;
  --tnm-font-mono:'JetBrains Mono',ui-monospace,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--tnm-backdrop);color:var(--tnm-text-primary);
  font-family:var(--tnm-font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit;background:none;border:none;outline:none;width:100%}
:focus-visible{outline:2px solid var(--tnm-action);outline-offset:2px;border-radius:4px}
.tnm-data{font-family:var(--tnm-font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hide{display:none!important}

#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--tnm-surface-ink);
  position:relative;display:flex;flex-direction:column}
@media(min-width:520px){#app{box-shadow:0 0 0 1px var(--tnm-border),0 32px 80px rgba(0,0,0,.55);
  margin:24px auto;min-height:calc(100dvh - 48px);border-radius:20px;overflow:clip}}
#view{flex:1;padding-bottom:120px}

/* ── top bar ── */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--tnm-surface-ink) 78%,transparent)}
.tb-btn{width:38px;height:38px;border-radius:var(--r-pill);background:var(--tnm-surface-ink-2);
  border:1px solid var(--tnm-border);display:grid;place-items:center;flex:none;position:relative}
.brand{font-weight:800;letter-spacing:-.02em;font-size:16px}
.brand small{display:block;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tnm-text-faint)}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:var(--r-pill);
  background:var(--tnm-action);color:var(--tnm-action-ink);font-size:10px;font-weight:700;
  display:grid;place-items:center;padding:0 4px}
.pin-chip{margin-left:auto;font-size:11px;color:var(--tnm-text-secondary);background:var(--tnm-surface-ink-2);
  border:1px solid var(--tnm-border);padding:7px 12px;border-radius:var(--r-pill);display:inline-flex;gap:5px;align-items:center}

/* ── shared ── */
.wrap{padding:0 16px}
.sec{margin-top:24px}
.sec-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tnm-text-faint);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec-label a,.sec-label button{font-size:11px;color:var(--tnm-action);letter-spacing:.06em;font-weight:600}
.card{background:var(--tnm-surface-ink-2);border:1px solid var(--tnm-border);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;
  border-radius:var(--r-md);font-size:14px;font-weight:600;transition:transform .12s,opacity .12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--tnm-action);color:var(--tnm-action-ink);
  box-shadow:0 8px 24px rgba(232,154,62,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-ghost{border:1px solid var(--tnm-border-strong)}
.btn-ghost-action{border:1px solid var(--tnm-action);color:var(--tnm-action)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn .sub{display:block;font-size:10.5px;font-weight:500;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  color:var(--tnm-text-secondary);background:var(--tnm-surface-ink-3);border:1px solid var(--tnm-border);
  padding:7px 12px;border-radius:var(--r-pill)}
.chip.sel{color:var(--tnm-action);background:var(--tnm-action-dim);border-color:var(--tnm-action)}
.fssai{flex:none;width:15px;height:15px;border:1.6px solid var(--m);border-radius:3px;display:grid;place-items:center}
.fssai.veg{--m:var(--tnm-mark-veg)}.fssai.nonveg{--m:var(--tnm-mark-nonveg)}
.fssai i{width:7px;height:7px;border-radius:50%;background:var(--m)}
.fssai.nonveg i{width:0;height:0;border-radius:0;background:none;
  border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--m)}
.notice{display:flex;gap:9px;align-items:flex-start;border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;line-height:1.5}
.notice svg{flex:none;margin-top:1px}
.notice.alert{background:var(--tnm-alert-dim);border:1px solid var(--tnm-alert)}
.notice.caution{background:var(--tnm-caution-dim);border:1px solid var(--tnm-caution)}
.notice.sage{background:var(--tnm-sage-dim);border:1px solid var(--tnm-sage)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill)}
.status.sage{color:var(--tnm-sage);background:var(--tnm-sage-dim)}
.status.caution{color:var(--tnm-caution);background:var(--tnm-caution-dim)}
.status.alert{color:var(--tnm-alert);background:var(--tnm-alert-dim)}

/* ── skeleton (CLS law: exact final boxes) ── */
.sk{background:var(--tnm-surface-ink-2);border-radius:var(--r-md);position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);
  animation:shimmer 1.3s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.sk::after{animation:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ── HOME ── */
.hero-doors{display:grid;gap:12px;margin-top:8px}
.door{position:relative;border-radius:var(--r-lg);overflow:clip;border:1px solid var(--tnm-border);
  min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;text-align:left}
.door .bg{position:absolute;inset:0;z-index:0}
.door .bg img{width:100%;height:100%;object-fit:cover;opacity:.5}
.door .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(16,22,26,.15),rgba(16,22,26,.92))}
.door>*:not(.bg){position:relative;z-index:1}
.door .eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tnm-action)}
.door h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.door p{font-size:12.5px;color:var(--tnm-text-secondary);margin-top:4px}
.door .go{margin-top:12px;align-self:flex-start}
.door.plan .eyebrow{color:var(--tnm-sage)}
.trust-strip{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:10.5px;
  color:var(--tnm-text-faint);letter-spacing:.04em;padding:14px 8px;border-top:1px solid var(--tnm-border);
  border-bottom:1px solid var(--tnm-border);margin-top:24px}
.trust-strip b{color:var(--tnm-text-secondary);font-weight:600}
.proof-band{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.proof-band::-webkit-scrollbar{display:none}
.proof{flex:0 0 auto;background:var(--tnm-surface-ink-2);border:1px solid var(--tnm-border);
  border-radius:var(--r-md);padding:11px 14px}
.proof .v{font-size:16px;font-weight:700}
.proof .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tnm-text-faint);margin-top:2px}
.prog{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.prog::-webkit-scrollbar{display:none}
.prog-card{flex:0 0 200px;background:var(--tnm-surface-ink-2);border:1px solid var(--tnm-border);
  border-radius:var(--r-lg);padding:14px;text-align:left}
.prog-card .tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tnm-sage)}
.prog-card h4{font-size:14.5px;font-weight:700;margin-top:6px}
.prog-card .m{font-size:11px;color:var(--tnm-text-secondary);margin-top:6px}
.pincode-row{display:flex;gap:8px;margin-top:12px}
.pincode-row .field{flex:1;background:var(--tnm-surface-ink-3);border:1px solid var(--tnm-border-strong);
  border-radius:var(--r-md);padding:0 14px;display:flex;align-items:center;min-height:48px}
.resume-strip{display:flex;align-items:center;gap:12px;background:var(--tnm-sage-dim);
  border:1px solid var(--tnm-sage);border-radius:var(--r-lg);padding:13px 15px}
.resume-strip .t{flex:1;font-size:13px}
.resume-strip .t b{display:block;font-size:13.5px}

/* ── MENU ── */
.filter-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.filter-row::-webkit-scrollbar{display:none}
.filter-row .chip{flex:none}
.menu-grid{display:grid;gap:12px;margin-top:14px}
.dish-card{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--tnm-surface-ink-2);
  border:1px solid var(--tnm-border);border-radius:var(--r-lg);padding:12px;align-items:center;min-height:120px}
.dish-card .ph{width:96px;height:96px;border-radius:var(--r-md);overflow:clip;background:var(--tnm-surface-ink-3);position:relative}
.dish-card .ph img{width:100%;height:100%;object-fit:cover}
.dish-card .ph.img-fallback::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 90% at 20% 10%,rgba(232,154,62,.14),transparent 55%),
  radial-gradient(100% 80% at 85% 90%,rgba(140,187,155,.12),transparent 60%)}
.dish-card .info{min-width:0}
.dish-card .nm{display:flex;align-items:flex-start;gap:7px}
.dish-card .nm h4{font-size:13.5px;font-weight:600;line-height:1.3}
.dish-card .macros{font-size:11px;color:var(--tnm-text-secondary);margin-top:5px}
.dish-card .row2{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.dish-card .pr{font-size:14px;font-weight:600}
.add-btn{min-height:44px;min-width:76px;border-radius:10px;border:1px solid var(--tnm-action);
  color:var(--tnm-action);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.add-btn.in{background:var(--tnm-action);color:var(--tnm-action-ink)}
.menu-empty{text-align:center;padding:40px 20px;color:var(--tnm-text-secondary);font-size:13px}

/* ── PDP (condensed plan-first) ── */
.pdp-hero{aspect-ratio:1/1;background:var(--tnm-surface-ink-2);position:relative;overflow:clip}
.pdp-hero img{width:100%;height:100%;object-fit:cover}
.pdp-hero.img-fallback::after{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tnm-text-faint)}
h1{font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.015em}
.gate-locked{position:relative;padding:16px}
.ghost{filter:blur(7px);opacity:.5;pointer-events:none;user-select:none}
.g-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--tnm-text-secondary)}
.g-row+.g-row{border-top:1px solid var(--tnm-border)}
.lock-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:9px;padding:18px;
  background:linear-gradient(180deg,rgba(23,31,37,.4),rgba(23,31,37,.9) 70%)}
.lock-layer h3{font-size:15.5px;font-weight:700}
.lock-layer p{font-size:12.5px;color:var(--tnm-text-secondary);max-width:280px}
.macro-row{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;padding:10px 0;
  border-top:1px solid var(--tnm-border)}
.macro-row:first-child{border-top:none}
.macro-row .mk{font-size:12.5px;color:var(--tnm-text-secondary)}
.macro-row .mv{font-size:16px;font-weight:600}
.macro-row .mv small{font-size:11px;color:var(--tnm-text-faint);font-weight:400}
.ing{font-size:12px;color:var(--tnm-text-secondary);background:var(--tnm-surface-ink-3);
  border:1px solid var(--tnm-border);padding:6px 11px;border-radius:var(--r-pill)}
.ing.flag{color:var(--tnm-alert);background:var(--tnm-alert-dim);border-color:var(--tnm-alert);font-weight:600}

/* ── BUILDER ── */
.stepper{display:flex;gap:6px;margin:14px 0 4px}
.stepper i{height:3px;flex:1;border-radius:var(--r-pill);background:var(--tnm-surface-ink-3)}
.stepper i.done{background:var(--tnm-action)}
.axis-grid{display:grid;gap:10px;margin-top:12px}
.axis-opt{border:1px solid var(--tnm-border-strong);border-radius:var(--r-md);padding:14px;text-align:left;
  background:var(--tnm-surface-ink-2);display:flex;align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s}
.axis-opt.sel{border-color:var(--tnm-action);box-shadow:0 0 0 1px var(--tnm-action)}
.axis-opt .t{font-size:14px;font-weight:700}
.axis-opt .d{font-size:11.5px;color:var(--tnm-text-secondary);margin-top:2px}
.axis-opt .pm{margin-left:auto;text-align:right}
.axis-opt .pm .v{font-size:15px;font-weight:700}
.axis-opt .pm .k{font-size:9.5px;color:var(--tnm-text-faint);letter-spacing:.08em;text-transform:uppercase}
.axis-opt .rec{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tnm-action)}
.quote-tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tnm-text-faint)}
.ribbon{display:flex;gap:8px}
.ribbon .cell{flex:1;background:var(--tnm-surface-ink-3);border:1px solid var(--tnm-border);
  border-radius:var(--r-md);padding:10px;text-align:center}
.ribbon .cell .v{font-size:15px;font-weight:700}
.ribbon .cell .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tnm-text-faint);margin-top:2px}
.pause-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--tnm-text-secondary);
  background:var(--tnm-surface-ink-3);border:1px dashed var(--tnm-border-strong);border-radius:var(--r-md);padding:11px 13px}
.wa-nudge{display:flex;align-items:center;gap:11px;background:var(--tnm-sage-dim);border:1px solid var(--tnm-sage);
  border-radius:var(--r-md);padding:12px 14px;font-size:12.5px}
.testimonial{font-size:13px;color:var(--tnm-text-secondary);font-style:italic;border-left:2px solid var(--tnm-sage);
  padding-left:12px}
.testimonial .who{display:block;font-style:normal;font-size:11px;color:var(--tnm-text-faint);margin-top:6px}

/* ── CART ── */
.line-item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:13px 0;
  border-top:1px solid var(--tnm-border)}
.line-item:first-child{border-top:none}
.line-item .ph{width:52px;height:52px;border-radius:10px;overflow:clip;background:var(--tnm-surface-ink-3)}
.line-item .ph img{width:100%;height:100%;object-fit:cover}
.line-item h5{font-size:13px;font-weight:600;line-height:1.3}
.line-item .mods{font-size:10.5px;color:var(--tnm-text-faint);margin-top:2px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--tnm-action);border-radius:10px;overflow:clip;margin-top:7px}
.qty button{width:34px;height:34px;color:var(--tnm-action);font-size:16px;font-weight:700;display:grid;place-items:center}
.qty .n{min-width:30px;text-align:center;font-size:13px;font-weight:700;color:var(--tnm-action)}
.line-item .lp{font-size:13.5px;font-weight:600;text-align:right}
.bill .b-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;color:var(--tnm-text-secondary)}
.bill .b-row .v{color:var(--tnm-text-primary)}
.bill .b-row.total{border-top:1px solid var(--tnm-border);margin-top:6px;padding-top:12px;font-size:15px;
  font-weight:700;color:var(--tnm-text-primary)}
.flash{animation:flash .5s}
@keyframes flash{0%{color:var(--tnm-action)}100%{}}
.aov-rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.aov-rail::-webkit-scrollbar{display:none}
.aov{flex:0 0 132px;background:var(--tnm-surface-ink-2);border:1px solid var(--tnm-border);
  border-radius:var(--r-md);padding:10px}
.aov .n{font-size:11.5px;font-weight:600;line-height:1.3;min-height:30px}
.aov .p{font-size:11px;color:var(--tnm-text-secondary);margin:6px 0 8px}
.empty-state{text-align:center;padding:52px 24px}
.empty-state h3{font-size:17px;font-weight:700;margin-top:14px}
.empty-state p{font-size:13px;color:var(--tnm-text-secondary);margin:6px 0 18px}

/* ── CHECKOUT ── */
.co-stepper{display:flex;gap:0;margin:6px 0 4px}
.co-step{flex:1;text-align:center;font-size:11px;font-weight:600;letter-spacing:.04em;
  color:var(--tnm-text-faint);padding-bottom:9px;border-bottom:2px solid var(--tnm-surface-ink-3)}
.co-step.on{color:var(--tnm-action);border-color:var(--tnm-action)}
.co-step.done{color:var(--tnm-text-secondary);border-color:var(--tnm-text-faint)}
.addr-card{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--tnm-border-strong);
  border-radius:var(--r-md);padding:13px;background:var(--tnm-surface-ink-2);text-align:left;width:100%}
.addr-card.sel{border-color:var(--tnm-action);box-shadow:0 0 0 1px var(--tnm-action)}
.addr-card .t{font-size:13px;font-weight:700}
.addr-card .d{font-size:11.5px;color:var(--tnm-text-secondary);margin-top:2px}
.toggle2{display:flex;background:var(--tnm-surface-ink-3);border:1px solid var(--tnm-border);
  border-radius:var(--r-md);padding:3px;gap:3px}
.toggle2 button{flex:1;min-height:40px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--tnm-text-secondary)}
.toggle2 button.on{background:var(--tnm-action);color:var(--tnm-action-ink)}
.slot-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.otp-row{display:flex;gap:8px;justify-content:center;margin:14px 0}
.otp-box{width:44px;height:52px;background:var(--tnm-surface-ink-3);border:1px solid var(--tnm-border-strong);
  border-radius:10px;text-align:center;font-family:var(--tnm-font-mono);font-size:20px;font-weight:600}
.otp-box:focus{border-color:var(--tnm-action)}
.pay-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:1px solid var(--tnm-border-strong);border-radius:var(--r-md);padding:13px 14px;background:var(--tnm-surface-ink-2)}

/* ── TRACK ── */

.backdrop{position:fixed;inset:0;background:rgba(6,8,10,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}

<body>

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA — PROTOTYPE LITERALS
   Prices: ₹155 (ACS) is live-verified; all others are PROTO
   estimates → bind to Petpooja catalog (wiring W-menu).
   Plan per-meal figures are ₹[quote] class — server-quoted in prod.
   ═══════════════════════════════════════════════════════════════ */
const IMG = s => 'https://tanmatra.food/images/dishes/' + s + '.jpg';
const DB = {
  dishes: [
    {id:'almond-chicken-salad', name:'Almond Chicken Salad', price:155, veg:false, gi:'Low',

     desc:'Tandoor-spiced tikka in a whole-wheat wrap with mint slaw.',

     desc:'Char-grilled vegetables and herbed hung curd on multigrain.',

    {id:'tomato-basil-omelette', name:'Tomato Basil Omelette', price:129, veg:false, gi:'Low',
     kcal:195, p:13, c:6, f:13, allergens:['egg'], goal:['weight-loss','pcos','general-wellness'],
     desc:'Three-egg omelette folded with roasted tomato and fresh basil.',
     ings:['Eggs','Cherry tomatoes','Basil','Olive oil','Black pepper']},
    {id:'amaranth-porridge-with-blueberry-sauce', name:'Amaranth Porridge, Blueberry Sauce', price:139, veg:true, gi:'Low',
     kcal:260, p:8, c:45, f:6, allergens:[], goal:['weight-loss','pcos'],

    {id:'apple-cinnamon-smoothie', name:'Apple Cinnamon Smoothie', price:119, veg:true, gi:'Medium',

    {id:'antioxidant-detox', name:'Antioxidant Detox Bowl', price:169, veg:true, gi:'Medium',

     desc:'Beet, pomegranate and citrus over black rice.',
     ings:['Black rice','Beetroot','Pomegranate','Orange','Pumpkin seeds']},
  ],
  aov: ['apple-cinnamon-smoothie','amaranth-porridge-with-blueberry-sauce','tomato-basil-omelette'],
  goals: {
    'weight-loss':{label:'Weight loss', avg:'Avg 32g P · 25g+ fibre'},
    'lean-muscle':{label:'Lean muscle', avg:'Avg 45g P · 30g+ fibre'},
    'general-wellness':{label:'General wellness', avg:'Balanced · steady energy'},
    'pcos':{label:'PCOS care', avg:'Avg 34g P · Low GI'},

  planPricing:{ trial:{label:'3-Day Trial', meals:3,  perMeal:133, note:'No auto-renewal'},
                week:{ label:'1 Week',      meals:5,  perMeal:179, note:'Renews weekly'},
                sixwk:{label:'6-Week Reset',meals:30, perMeal:149, note:'Commitment discount'} },
  dinnerPerMeal:{trial:133, week:169, sixwk:141},
  serviceable: p => /^(2013|1220|1100|110|122)/.test(p) && p.length===6,
  slots:['12:30–1:15 PM','1:15–2:00 PM','7:30–8:15 PM'],
};
const dish = id => DB.dishes.find(d=>d.id===id);
const money = n => '₹' + n.toLocaleString('en-IN');

/* ═══════════ STATE ═══════════ */
const S0 = () => ({
  pincode:null, serviceable:null,
  profile:null, unlocked:false,
  cart:[],                                   /* {id, qty, price(client), mods[]} */
  builder:{step:1, duration:null, meals:null, pref:null},
  plan:null,                                 /* committed plan */
  co:{step:1, addr:null, mode:'now', slot:null, phase:'phone', phone:'', pay:'upi', tip:20, voucher:0},
  order:null, statusIdx:0,
  flags:{allergen:false, oos:false, svcFail:false, tamper:false, payFail:false, delayed:false},
});
let S = S0();

/* ═══════════ helpers ═══════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function go(path){location.hash = path;}
function cartCount(){return S.cart.reduce((s,i)=>s+i.qty,0);}
function clientTotal(){return S.cart.reduce((s,i)=>s+i.price*i.qty,0);}
/* W1 · SERVER PRICE AUTHORITY (simulated /orders/quote):
   recomputes from the server catalog — never trusts client line prices */
function serverQuote(){return S.cart.reduce((s,i)=>s+dish(i.id).price*i.qty,0);}
function gst(sub){return Math.round(sub*0.05);}                 /* 5% prepared food */
function delivery(sub){return sub>=199||sub===0?0:30;}
function grand(sub){return sub+gst(sub)+delivery(sub)-S.co.voucher+(S.co.step===3?S.co.tip:0);}
function allergenActive(d){
  const flag = S.flags.allergen || (S.profile && S.profile.allergens.some(a=>d.allergens.includes(a)));
  return !!flag;
}
const icons = {
  check:'<svg width="__S" height="__S" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',

/* 2px macro gauge — Stitch DS "Progress Gauges", arc color follows status tone */
function ring(label,val,pct,tone){
  pct=Math.max(.06,Math.min(pct||0,1));
  const R=30,C=2*Math.PI*R,dash=(C*pct).toFixed(1);
  const col=tone==='caution'?'var(--tnm-caution)':tone==='alert'?'var(--tnm-alert)':'var(--tnm-sage)';
  return '<div class="ring"><svg viewBox="0 0 74 74" width="74" height="74" aria-hidden="true">'
    +'<circle cx="37" cy="37" r="30" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/>'
    +'<circle cx="37" cy="37" r="30" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-dasharray="'+dash+' '+C.toFixed(1)+'" transform="rotate(-90 37 37)"/></svg>'
    +'<span class="rv tnm-data">'+val+'<small>'+label+'</small></span></div>';
}

let openSheetFlag=false;

  const sh=$('#sheet'), bd=$('#backdrop');

  sh.innerHTML='<div class="sheet-grip"></div>'+html;

}

/* ── PLANS · /plans · frames: empty / active / paused / day-skipped /
      swap-sheet / skip-confirm  (Stitch 175, 7, 23, 153, 190) ── */
function screenPlans(){
  if(!S.plan){
    $('#view').innerHTML='<div class="empty-state">'
      +'<span style="color:var(--tnm-text-faint)">'+ic('clock',34)+'</span>'
      +'<h3>No active plan</h3><p>A dietitian-designed week, matched to your goal. No manual daily ordering.</p>'

  }
  const gk=(S.profile&&S.profile.goal)||'general-wellness';

  const avgP=Math.round(wk.reduce((s,d)=>s+dish(d.id).p,0)/(wk.length||1));
  const avgK=Math.round(wk.reduce((s,d)=>s+dish(d.id).kcal,0)/(wk.length||1));

  +'<p style="font-size:12.5px;color:var(--tnm-text-secondary);margin-top:3px">'+S.plan.label+S.plan.summary+'</p>'
  +(S.plan.paused?'<div class="notice caution sec">'+ic('info')+'<span><b>Plan paused.</b> Deliveries resume when you do — credits hold, nothing is lost.</span></div>':'')
  +'<div class="card sec" style="display:flex;gap:14px;align-items:center">'
  +'<div class="ring-strip" style="margin:0">'
  +   ring('AVG KCAL',avgK,avgK/KMAX,avgK>KMAX*.92?'caution':'sage')
  +   ring('AVG P',avgP+'g',avgP/PREF,avgP>=PREF*.9?'sage':'caution')+'</div>'
  +'<div style="font-size:12px;color:var(--tnm-text-secondary)">This week\'s rotation vs your <b style="color:var(--tnm-text-primary)">'+DB.goals[gk].label.toLowerCase()+'</b> targets. Every dish RD-approved.</div></div>'
  +'<div class="sec"><div class="sec-label">This week<button data-act="pPause">'+(S.plan.paused?'Resume plan':'Pause plan')+'</button></div>'

        : '<span class="status" style="color:var(--tnm-text-faint);background:var(--tnm-surface-ink-3)">Upcoming</span>';
      return '<div class="day-card'+(st==='skipped'?' skipped':'')+'">'
      +'<span class="day-tag tnm-data">'+d.day+'</span>'
      +'<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><b style="font-size:13px">'+dd.name+'</b><span style="color:var(--tnm-sage)" title="RD approved">'+ic('check',11)+'</span>'+(d.swapped?'<span style="font-size:9.5px;color:var(--tnm-text-faint)">· swapped</span>':'')+'</div>'
      +'<div class="tnm-data" style="font-size:10.5px;color:var(--tnm-text-secondary)">'+dd.kcal+' kcal · '+dd.p+'g P · GI '+dd.gi+'</div></div>'
      + pill
      +(st==='upcoming'&&!S.plan.paused
          ? '<span style="display:flex;gap:6px"><button class="mini-act" data-act="pSwap" data-x="'+x+'">Swap</button><button class="mini-act" data-act="pSkip" data-x="'+x+'">Skip</button></span>'
          : st==='skipped' ? '<button class="mini-act" data-act="pSkipUndo" data-x="'+x+'">Undo</button>' : '')

    ? '<div style="margin-top:8px"><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tnm-text-faint)">Arriving</div><div class="eta-big tnm-data">'+(S.flags.delayed?'1:28':'1:04')+'<span style="font-size:15px;font-weight:500;color:var(--tnm-text-secondary)"> PM</span></div></div>'
    : '<p style="font-size:12.5px;color:var(--tnm-text-secondary);margin-top:3px">Delivered · enjoy</p>')
  +(S.flags.delayed&&idx<4? '<div class="notice caution sec">'+ic('clock')+'<span><b>Running ~<span class="tnm-data">15</span> min late.</b> Rider hit the Sector 62 signal — honest ETA above, meal stays chilled.</span></div>':'')
  +'<div class="card sec"><div class="tl">'
  + STATUSES.map((s,i)=>'<div class="tl-item '+(i<idx?'done':i===idx?'on':'')+'"><span class="tl-dot">'+(i<idx?'<span style="color:var(--tnm-sage)">'+ic('check',9)+'</span>':'')+'</span>'
    +'<div class="t">'+s.t+'</div>'
    +(s.d==='rider'&&i===idx? '<div class="rider" style="margin-top:8px;width:100%"><span class="av">RK</span><span style="flex:1"><b style="font-size:13px;display:block">Ravi K.</b><span style="font-size:11px;color:var(--tnm-text-secondary)">ETA <span class="tnm-data">'+(S.flags.delayed?'24':'12')+' min</span> · <span class="tnm-data">1.8 km</span> out</span></span><button class="tb-btn" data-act="callRider" aria-label="Call rider">'+ic('phone',15)+'</button></div>'
      : '<div class="d">'+(s.d==='rider'?'Rider assigned at dispatch':s.d)+'</div>')
    +'</div>').join('')
  +'</div></div>'
  +(idx===4? '<div class="cta-bar" style="position:static;padding:16px 0 0"><button class="btn btn-ghost-action" data-act="seedCart">Reorder</button><button class="btn btn-primary" data-act="rate">Rate the dish</button></div>':'')
  +'</div>';
  setCTA(idx<4? '<div class="cta-bar"><button class="btn btn-ghost" data-act="zen"><span>Zen mode<span class="sub">chrome-free tracking</span></span></button></div>':'');
  renderZen();
}
function renderZen(){
  const idx=Math.min(S.statusIdx,4);
  $('#zenLayer').innerHTML = S.order
    ? '<div class="zen-rings"><span class="r"></span><span class="r r2"></span><span class="r r3"></span><span class="arc"></span><span class="core"></span></div><h2>'+STATUSES[idx].t+'</h2>'
      +'<div class="eta tnm-data">'+(idx<4?(S.flags.delayed?'1:28 PM':'1:04 PM'):'Delivered')+'</div>'
      +'<button class="exit" data-act="zen">back to standard view</button>'
    : '';
}

/* ═══════════ SHEETS ═══════════ */
function openAssess(){
  const goals=Object.keys(DB.goals);
  sheet('<h3>Goal Fit check</h3><p style="font-size:12.5px;color:var(--tnm-text-secondary);margin-top:4px">Two taps — held for every dish and your plan rotation.</p>'
  +'<div class="sec-label" style="margin-top:16px">Goal</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
  + goals.map(g=>'<button class="chip aGoal" data-ag="'+g+'" style="justify-content:center;min-height:46px">'+DB.goals[g].label+'</button>').join('')
  +'</div><div class="sec-label" style="margin-top:16px">Allergen watch</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
  + [['tree-nuts','Tree nuts'],['dairy','Dairy'],['gluten','Gluten'],['none','None']].map(a=>'<button class="chip aAlg" data-aa="'+a[0]+'" style="justify-content:center;min-height:46px">'+a[1]+'</button>').join('')
  +'</div><button class="btn btn-primary" id="btnFinishAssess" style="width:100%;margin-top:18px" disabled>See my fit</button>');
}
let A={goal:null,algs:new Set()};
let pendAdd=null;
let pendDay=null;
/* Clinical Allergen Gate — explicit consent, safe action is primary */
function openAllergenAck(d){
  sheet('<h3 style="display:flex;gap:9px;align-items:center"><span style="color:var(--tnm-alert)">'+ic('warn',19)+'</span>Contains '+d.allergens.join(', ').replace('-',' ')+'</h3>'
  +'<p class="sheet-sub" style="margin-top:6px">Your Goal Fit profile flags this. The declaration below is complete — flagged items in error tone.</p>'
  +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">'
  + d.ings.map(i=>'<span class="ing'+(/almond|paneer|curd|milk|wheat|roti|bread|egg/i.test(i)&&d.allergens.length?' flag':'')+'">'+i+'</span>').join('')+'</div>'
  +'<div class="notice caution" style="margin-top:14px">'+ic('info')+'<span>Cross-contact controls are in place, but this dish is prepared with the flagged ingredient. Acknowledged orders are logged for kitchen visibility.</span></div>'
  +'<div style="display:grid;gap:10px;margin-top:18px">'
  +'<button class="btn btn-primary" data-act="ackBack">Choose another dish</button>'
  +'<button class="btn btn-ghost" data-act="ackAdd">I understand — add anyway</button></div>');
}
/* Trial Recap & Upgrade Bridge (A2): recap → offer → explicit choice, nothing silent */
function openTrialBridge(){
  sheet('<h3>Your 3-day trial, measured</h3>'
  +'<div class="ribbon" style="margin-top:14px">'
  +'<div class="cell"><div class="v tnm-data">3/3</div><div class="k">delivered on time</div></div>'
  +'<div class="cell"><div class="v tnm-data">41g</div><div class="k">avg protein</div></div>'
  +'<div class="cell"><div class="v tnm-data">Low</div><div class="k">avg GI</div></div></div>'
  +'<div class="card" style="margin-top:12px;padding:12px 14px;display:grid;gap:8px">'
  + [['Almond Chicken Salad','472 kcal · 43g P'],['Grilled Chicken, Veg & Mash','520 kcal · 46g P'],['Tomato Basil Omelette','195 kcal · 13g P']]
    .map(m=>'<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>'+m[0]+'</span><span class="tnm-data" style="color:var(--tnm-text-secondary)">'+m[1]+'</span></div>').join('')+'</div>'
  +'<div class="card" style="margin-top:12px;border-color:var(--tnm-action)">'
  +'<b style="font-size:14px">Keep the rotation going — Weekly Plan</b>'
  +'<p style="font-size:12px;color:var(--tnm-text-secondary);margin-top:3px"><span class="tnm-data">₹179</span>/meal <span class="quote-tag">· quoted</span> · pause or skip any day · same UPI offered as default, never reused silently</p></div>'
  +'<div style="display:grid;gap:10px;margin-top:16px">'
  +'<button class="btn btn-primary" data-act="bridgeStart"><span>Start weekly plan<span class="sub">renews weekly · explicit tap required</span></span></button>'
  +'<button class="btn btn-ghost" data-act="closeSheet">Decide later</button></div>');
}
/* /plans helpers — Stitch 175/23/153 */
function seedWeek(){
  const gk=(S.profile&&S.profile.goal)||'general-wellness';
  const pool=DB.dishes.filter(d=>d.goal.includes(gk)&&(S.builder.pref!=='veg'||d.veg));
  const src=pool.length?pool:DB.dishes;
  return ['Mon','Tue','Wed','Thu','Fri'].map((dy,x)=>({day:dy,id:src[x%src.length].id,status:x===0?'delivered':'upcoming'}));
}
function openSwapSheet(x){
  pendDay=x;
  const cur=dish(S.plan.week[x].id);
  const gk=(S.profile&&S.profile.goal)||'general-wellness';
  const CAP={'weight-loss':520,'lean-muscle':700,'general-wellness':650,'pcos':550}[gk];
  const pool=DB.dishes.filter(d=>d.id!==cur.id&&d.goal.includes(gk));
  const heavy=DB.dishes.filter(d=>d.id!==cur.id&&!pool.includes(d)).sort((a,b)=>b.kcal-a.kcal)[0];
  const alts=[...pool.slice(0,3),...(heavy?[heavy]:[])];
  sheet('<h3>Clinically compatible swaps</h3>'
  +'<p class="sheet-sub" style="margin-top:4px">Swapping out <b>'+cur.name+'</b> · '+S.plan.week[x].day+'. Alternatives stay inside your '+DB.goals[gk].label.toLowerCase()+' caps.</p>'
  + alts.map(a=>{
      const dk=a.kcal-cur.kcal, dp=a.p-cur.p, capped=a.kcal>CAP*0.92;
      const match=Math.max(62,100-Math.round(Math.abs(dk)/cur.kcal*100+Math.abs(dp)*1.2));
      return '<button class="swap-row'+(capped?' capped':'')+'"'+(capped?'':' data-act="pSwapPick" data-id="'+a.id+'"')+'>'
      +'<span style="flex:1;min-width:0"><b style="font-size:13px;display:block">'+a.name+'</b>'
      +'<span style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">'
      +(capped?'':'<span class="match-tag tnm-data">'+match+'% match</span>')
      +'<span class="delta tnm-data">P '+(dp>=0?'+':'')+dp+'g</span><span class="delta tnm-data">kcal '+(dk>=0?'+':'')+dk+'</span></span>'
      +(capped?'<span style="display:block;font-size:10.5px;color:var(--tnm-caution);margin-top:6px">'+ic('warn',10)+' Exceeds your plan\'s macro caps · Unavailable</span>':'')
      +'</span>'+(capped?'':'<span style="color:var(--tnm-action);font-size:12px;font-weight:700">Select</span>')+'</button>';}).join('')
  +'<button class="btn btn-ghost" style="width:100%;margin-top:14px" data-act="closeSheet">Cancel</button>');
}
function openSkipSheet(x){
  pendDay=x;
  const d=S.plan.week[x];
  sheet('<h3>Skip '+d.day+'\'s lunch?</h3>'
  +'<div class="notice sage" style="margin-top:14px">'+ic('check')+'<span><b style="color:var(--tnm-sage)">Credit rolls forward.</b> The meal credit returns to your plan — your week extends by one day.</span></div>'
  +'<div class="notice caution" style="margin-top:8px">'+ic('info')+'<span>Your streak pauses for the day; protein baseline stays intact.</span></div>'
  +'<div style="display:grid;gap:10px;margin-top:16px">'
  +'<button class="btn btn-primary" data-act="pSkipConfirm">Confirm skip</button>'
  +'<button class="btn btn-ghost" data-act="closeSheet">Cancel</button></div>'
  +'<p style="font-size:10px;color:var(--tnm-text-faint);text-align:center;margin-top:12px">Action logged for kitchen planning.</p>');
}
function orderSuccessSheet(kind, total){
  const id=Math.floor(1000+Math.random()*9000);
  if(kind==='order'){S.order={id};S.statusIdx=0;}
  sheet('<div class="success-hero"><span class="success-ring"><span style="color:var(--tnm-sage)">'+ic('check',30)+'</span></span></div>'
  +'<div style="text-align:center;padding:0 8px"><h3 style="font-size:19px">'+(kind==='order'?'Order confirmed':'Plan started')+'</h3>'
  +'<p style="font-size:13px;color:var(--tnm-text-secondary);margin-top:5px">'+(kind==='order'?('Order <span class="tnm-data">TNM-'+id+'</span> · paid <span class="tnm-data">'+money(total)+'</span>'):'First delivery Monday · pause or skip anytime')+'</p>'
  +'<div class="kv-card" style="margin-top:16px;text-align:left"><div><div class="k">'+(kind==='order'?'Window':'Slot')+'</div><div class="v tnm-data">12:30–1:15 PM</div></div><div style="text-align:right"><div class="k">Kitchen</div><div class="v">Noida Sec 63</div></div></div></div>'
  +'<div style="display:grid;gap:10px;margin-top:20px">'
  +(kind==='order'?'<button class="btn btn-primary" data-act="goTrack">Track live</button>':'<button class="btn btn-primary" data-go="/plans" data-closesheet="1">View my week</button>')
  +'<button class="btn btn-ghost" data-act="closeSheet">Keep browsing</button></div>');
}

/* ═══════════ ROUTER ═══════════ */
let current='/';
function route(){
  const h=(location.hash.slice(1)||'/');
  current=h;
  const parts=h.split('/').filter(Boolean);
  renderTopbar(h);
  window.scrollTo(0,0);
  if(h==='/'||h==='') screenHome();
  else if(h==='/menu') screenMenu();
  else if(parts[0]==='dish') screenDish(parts[1]);
  else if(h==='/subscribe') screenSubscribe();
  else if(h==='/cart') screenCart();
  else if(h==='/checkout') screenCheckout();
  else if(h==='/plans') screenPlans();
  else if(h==='/track') screenTrack();
  else screenHome();
  devSync();
}
window.addEventListener('hashchange',route);

/* ═══════════ EVENT DELEGATION ═══════════ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-act],[data-add],[data-qty],[data-fgoal],[data-bdur],[data-bmeals],[data-bpref],[data-addr],[data-mode],[data-slot],[data-pay],[data-tip],[data-ag],[data-aa],[data-tgl]');
  if(!el)return;
  const D=el.dataset;

  if(D.closesheet)sheet(false);
  if(D.go){go(D.go);return;}
  if(D.tgl){S.flags[D.tgl]=!S.flags[D.tgl];toast(D.tgl+' '+(S.flags[D.tgl]?'ON':'OFF'));route();return;}

  switch(D.act){
    case 'back': history.length>1?history.back():go('/'); return;
    case 'goCart': go('/cart'); return;
    case 'checkPin': {
      const v=($('#pinInput')||{}).value||'';
      if(!/^\d{6}$/.test(v)){toast('Enter a 6-digit pincode');return;}
      S.pincode=v; S.serviceable=DB.serviceable(v)&&!S.flags.svcFail; route(); return;}
    case 'clearFilters': menuFilter={goal:null,veg:false,healthy:false}; route(); return;
    case 'fVeg': menuFilter.veg=!menuFilter.veg; route(); return;
    case 'fHealthy': menuFilter.healthy=!menuFilter.healthy; route(); return;
    case 'openAssess': A={goal:S.profile?S.profile.goal:null, algs:new Set(S.profile?S.profile.allergens:[])}; openAssess(); syncAssess(); return;
    case 'notify': toast('We\'ll ping you when it\'s back — 11:30 AM'); return;
    case 'addToPlan': {
      const d=dish(D.id);
      if(allergenActive(d)){pendAdd={id:D.id,stay:true,mode:'plan'};openAllergenAck(d);return;}
      if(!S.plan){go('/subscribe');toast('Build the plan this dish joins');return;}
      toast('Added to this week\'s rotation'); return;}
    case 'bBack': S.builder.step=Math.max(1,S.builder.step-1); route(); return;
    case 'bNext': S.builder.step=Math.min(4,S.builder.step+1); route(); return;
    case 'bCommit': {
      const P=DB.planPricing[S.builder.duration];
      S.plan={label:P.label, paused:false, week:seedWeek(), summary:' · '+({'1':'lunch','2':'lunch + dinner'})[S.builder.meals]+' · '+({veg:'veg',mixed:'mixed',hp:'high-protein'})[S.builder.pref]+' rotation'};
      orderSuccessSheet('plan',0); return;}
    case 'coNext': S.co.step=Math.min(3,S.co.step+1); route(); return;
    case 'sendOtp': S.co.phone=($('#phoneInput')||{}).value||S.co.phone;
      if(!/^\d{10}$/.test(S.co.phone)){toast('Enter a 10-digit number');return;}
      S.co.phase='otp'; route(); setTimeout(()=>{const b=$('.otp-box');b&&b.focus();},60); return;
    case 'verifyOtp': S.co.phase='address'; route(); return;
    case 'fakeAddAddr': toast('Address form — pincode-first, serviceability inline (Wave-2 /account/addresses)'); return;
    case 'applyVoucher': {
      const v=(($('#voucherInput')||{}).value||'').trim().toUpperCase();
      if(v==='TNM50'){S.co.voucher=50;toast('TNM50 applied — ₹50 off');}
      else toast('Code not recognised'); route(); return;}
    case 'payNow': {
      if(S.flags.tamper){toast('Blocked — server price authority');return;}
      S.co.phase='processing'; S.order={id:Math.floor(1000+Math.random()*9000)}; route();
      setTimeout(()=>{
        if(S.flags.payFail){S.co.phase='failed'; route(); return;}
        const paid=grand(serverQuote());
        S.cart=[]; S.co.phase='pay'; S.co.step=1; S.statusIdx=0;
        route(); orderSuccessSheet('order',paid);
      },1600); return;}
    case 'switchMethod': S.co.phase='pay'; S.flags.payFail=false; route(); return;
    case 'resync': S.flags.tamper=false; S.cart.forEach(i=>i.price=dish(i.id).price); toast('Prices re-synced from server'); route(); return;
    case 'goTrack': sheet(false); go('/track'); return;
    case 'trialBridge': openTrialBridge(); return;
    case 'goPlanTrack': go('/plans'); return;
    case 'pPause': S.plan.paused=!S.plan.paused; toast(S.plan.paused?'Plan paused — credits hold':'Plan resumed'); route(); return;
    case 'pSwap': openSwapSheet(+D.x); return;
    case 'pSwapPick': {const w=S.plan.week[pendDay]; w.id=D.id; w.swapped=true; pendDay=null; sheet(false); toast('Swapped — macros stay on target'); route(); return;}
    case 'pSkip': openSkipSheet(+D.x); return;
    case 'pSkipConfirm': S.plan.week[pendDay].status='skipped'; pendDay=null; sheet(false); toast('Skipped — credit rolls forward'); route(); return;
    case 'pSkipUndo': S.plan.week[+D.x].status='upcoming'; toast('Restored'); route(); return;
    case 'pModify': go('/subscribe'); toast('Adjust duration — savings recalc live'); return;
    case 'rate': toast('Thanks — review posts after moderation'); return;
    case 'zen': S.flags.zen=!S.flags.zen; document.body.classList.toggle('is-zen',S.flags.zen); renderZen(); return;
    case 'closeSheet': sheet(false); return;
    case 'ackBack': pendAdd=null; sheet(false); go('/menu'); return;
    case 'ackAdd': {
      if(!pendAdd){sheet(false);return;}
      sheet(false);
      if(pendAdd.mode==='plan'){
        if(!S.plan){go('/subscribe');toast('Build the plan this dish joins');}
        else toast('Added to rotation — allergen acknowledgment logged');
      } else {
        addToCart(pendAdd.id);
        toast('Added — allergen acknowledgment logged');
        if(!pendAdd.stay)go('/cart'); else route();
      }
      pendAdd=null; return;}
    case 'bridgeStart':
      S.plan={label:'Weekly Plan',summary:' · lunch · mixed rotation',paused:false,week:seedWeek()};
      orderSuccessSheet('plan',0); return;
    case 'callRider': toast('Calling rider — masked number in prod'); return;
    /* dev acts */
    case 'emptyCart': S.cart=[]; toast('Cart emptied'); route(); return;
    case 'seedCart': addToCart('almond-chicken-salad'); addToCart('grilled-chicken-veg-mash'); toast('Cart seeded'); route(); return;
    case 'trackAdv': if(!S.order){S.order={id:4271};} S.statusIdx=Math.min(4,S.statusIdx+1); if(current!=='/track')go('/track');else route(); return;
    case 'resetAll': S=S0(); menuLoaded=false; menuFilter={goal:null,veg:false,healthy:false}; document.body.classList.remove('is-zen'); sheet(false); go('/'); route(); return;
  }

  if(D.add){
    const dd=dish(D.add);
    if(allergenActive(dd)){pendAdd={id:D.add,stay:!!D.stay,mode:'once'};openAllergenAck(dd);return;}
    addToCart(D.add); if(!D.stay)go('/cart'); else route(); return;}
  if(D.qty){const i=S.cart[+D.x]; i.qty+=+D.qty; if(i.qty<=0)S.cart.splice(+D.x,1); route();
    $$('#view [data-bill]').forEach(n=>{n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');}); return;}
  if(D.fgoal){menuFilter.goal=menuFilter.goal===D.fgoal?null:D.fgoal; route(); return;}
  if(D.bdur){S.builder.duration=D.bdur; route(); return;}
  if(D.bmeals){S.builder.meals=D.bmeals; route(); return;}
  if(D.bpref){S.builder.pref=D.bpref; route(); return;}
  if(D.addr!==undefined){S.co.addr=+D.addr; route(); return;}
  if(D.mode){S.co.mode=D.mode; if(D.mode==='now')S.co.slot=null; route(); return;}
  if(D.slot){S.co.slot=D.slot; route(); return;}
  if(D.pay){S.co.pay=D.pay; route(); return;}
  if(D.tip!==undefined){S.co.tip=+D.tip; route(); return;}
  if(D.ag){A.goal=D.ag; syncAssess(); return;}
  if(D.aa){const v=D.aa;
    if(v==='none'){A.algs.clear();A.algs.add('none');}
    else{A.algs.delete('none'); A.algs.has(v)?A.algs.delete(v):A.algs.add(v);}
    syncAssess(); return;}
});
function addToCart(id){
  const i=S.cart.find(x=>x.id===id);
  if(i)i.qty++;
  else S.cart.push({id, qty:1, price:dish(id).price, mods:[]});
  if(S.flags.tamper)S.cart[0].price=1;     /* tamper demo persists */
  toast('Added — '+dish(id).name);
}
function syncAssess(){
  $$('.aGoal').forEach(b=>b.classList.toggle('sel',b.dataset.ag===A.goal));
  $$('.aAlg').forEach(b=>b.classList.toggle('sel',A.algs.has(b.dataset.aa)));
  const btn=$('#btnFinishAssess'); if(btn)btn.disabled=!(A.goal&&A.algs.size);
}
document.addEventListener('click',e=>{
  if(e.target.id==='btnFinishAssess'&&!e.target.disabled){
    S.profile={goal:A.goal, allergens:[...A.algs].filter(x=>x!=='none')};
    S.unlocked=true; sheet(false); route();
  }
});
/* OTP boxes: auto-advance */
document.addEventListener('input',e=>{
  if(e.target.classList.contains('otp-box')){
    e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);
    if(e.target.value){const n=e.target.parentElement.querySelector('[data-otp="'+(+e.target.dataset.otp+1)+'"]');n&&n.focus();}
    const full=$$('.otp-box').every(b=>b.value);
    const v=$('#btnVerify'); if(v)v.disabled=!full;
  }
  if(e.target.id==='pinInput'||e.target.id==='phoneInput')
    e.target.value=e.target.value.replace(/\D/g,'');
});

/* ═══════════ DEV STRIP ═══════════ */
$('#devPill').addEventListener('click',()=>{
  $('#dev').classList.toggle('open');
  $('#devPill').setAttribute('aria-expanded',$('#dev').classList.contains('open'));
});
function devSync(){
  $$('#devPanel [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===current));
  const f=S.flags;
  $('#devState').textContent='route: '+current
    +'\ncart: '+cartCount()+' · '+money(clientTotal())+' (srv '+money(serverQuote())+')'
    +'\nprofile: '+(S.profile?S.profile.goal+'/['+S.profile.allergens.join(',')+']':'none')
    +'\nplan: '+(S.plan?S.plan.label:'none')
    +'\nco: step '+S.co.step+' · '+S.co.phase
    +'\norder: '+(S.order?'TNM-'+S.order.id+' @'+S.statusIdx:'none')
    +'\nflags: '+Object.keys(f).filter(k=>f[k]).join(',')||'—';
}

/* boot */
route();
</script>
